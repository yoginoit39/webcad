<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebCAD — Personal CAD</title>
<style>
:root {
  --bg: #f7f7f8;
  --panel: #ffffff;
  --panel-2: #fafafa;
  --border: #e5e5e7;
  --border-soft: #ececef;
  --ink: #1a1a1f;
  --ink-2: #4a4a55;
  --muted: #8a8a95;
  --hover: #f0f0f3;
  --active-bg: #eef2ff;
  --active-ink: #2c4be3;
  --accent: #2c4be3;
  --accent-soft: #e7ecff;
  --canvas-bg: #fafafa;
  --shadow: 0 1px 2px rgba(15,15,30,0.04), 0 0 0 1px rgba(15,15,30,0.04);
}
body.theme-dark {
  --bg: #1a1a1d;
  --panel: #232327;
  --panel-2: #1f1f22;
  --border: #2e2e33;
  --border-soft: #29292d;
  --ink: #ececf0;
  --ink-2: #b8b8c0;
  --muted: #6e6e78;
  --hover: #2c2c30;
  --active-bg: #21307a;
  --active-ink: #cfd8ff;
  --accent: #6c8aff;
  --accent-soft: #1f2a55;
  --canvas-bg: #16161a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; user-select: none; }
body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column; font-size: 13px; }

#topbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 6px 10px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#topbar button, #topbar select { background: var(--panel); color: var(--ink); border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; font-size: 12px; border-radius: 6px; transition: background 80ms ease, border-color 80ms ease; }
#topbar button:hover { background: var(--hover); border-color: var(--border-soft); }
#topbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
#topbar .group-label { font-size: 11px; color: var(--muted); margin-right: 4px; letter-spacing: 0.02em; }

#main { flex: 1; display: flex; min-height: 0; overflow: hidden; }

#toolbar {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 5px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: 0 12px 36px rgba(15,15,30,0.10), 0 1px 3px rgba(15,15,30,0.06);
  z-index: 100;
}
#toolbar .tb-row { display: flex; gap: 1px; align-items: center; }
#toolbar button { background: transparent; color: var(--ink); border: 1px solid transparent; padding: 0; cursor: pointer; font-size: 15px; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; transition: background 80ms ease, color 80ms ease; }
#toolbar button:hover { background: var(--hover); }
#toolbar button.active { background: var(--active-bg); color: var(--active-ink); }
#toolbar .tool-sep { width: 1px; height: 22px; background: var(--border); margin: 0 5px; }

#canvas-wrap { flex: 1; position: relative; min-width: 0; background: var(--canvas-bg); }
#canvas { display: block; cursor: crosshair; outline: none; }

#right-panel { width: 248px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; flex-shrink: 0; }
.panel-section { border-bottom: 1px solid var(--border); }
.panel-header { background: var(--panel); padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.panel-header:hover { color: var(--ink); }
.panel-header .ph-title { display: flex; align-items: center; gap: 6px; }
.panel-header .ph-title::before { content: '▾'; font-size: 9px; color: var(--muted); transition: transform 120ms ease; display: inline-block; }
.panel-section.collapsed .panel-header .ph-title::before { transform: rotate(-90deg); }
.panel-section.collapsed .panel-body { display: none; }
.panel-body { padding: 4px 12px 10px; max-height: 320px; overflow-y: auto; font-size: 12px; }

.layer-row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; cursor: pointer; border-radius: 6px; }
.layer-row:hover { background: var(--hover); }
.layer-row.active { background: var(--active-bg); color: var(--active-ink); }
.layer-row .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); cursor: pointer; flex-shrink: 0; }
.layer-row .vis, .layer-row .lock { width: 18px; text-align: center; cursor: pointer; opacity: 0.6; font-size: 12px; }
.layer-row .vis:hover, .layer-row .lock:hover { opacity: 1; }
.layer-row .name { flex: 1; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }

.prop-row { display: flex; align-items: center; padding: 3px 0; gap: 6px; }
.prop-row label { font-size: 11px; color: var(--muted); width: 78px; flex-shrink: 0; }
.prop-row input, .prop-row select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); padding: 3px 6px; flex: 1; font-size: 12px; border-radius: 4px; }
.prop-row input:focus, .prop-row select:focus { outline: none; border-color: var(--accent); }

#layer-add { background: var(--panel); color: var(--ink); border: 1px solid var(--border); padding: 1px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; }
#layer-add:hover { background: var(--hover); }

#bottom { background: var(--panel); padding: 0; font-size: 12px; display: flex; flex-direction: column; border-top: 1px solid var(--border); flex-shrink: 0; }
#cmdline { display: flex; background: var(--panel); color: var(--ink); padding: 6px 12px; font-family: "SF Mono", "Menlo", monospace; font-size: 12px; }
#cmdline .prompt { color: var(--accent); margin-right: 8px; white-space: nowrap; font-weight: 500; }
#cmdline input { background: var(--panel-2); border: 1px solid var(--border); outline: none; color: var(--ink); flex: 1; font-family: inherit; font-size: inherit; padding: 3px 8px; border-radius: 4px; }
#cmdline input:focus { border-color: var(--accent); }
#cmdhistory { background: var(--panel-2); color: var(--ink-2); padding: 4px 12px; font-family: "SF Mono", "Menlo", monospace; font-size: 11px; max-height: 60px; overflow-y: auto; border-top: 1px solid var(--border-soft); }
#cmdhistory .err { color: #d83a3a; }
#cmdhistory .info { color: var(--accent); }
#statusbar { display: flex; gap: 14px; padding: 4px 12px; font-family: "SF Mono", "Menlo", monospace; font-size: 11px; background: var(--panel-2); color: var(--ink-2); border-top: 1px solid var(--border-soft); }
#statusbar .toggle { cursor: pointer; padding: 2px 8px; border-radius: 4px; color: var(--muted); }
#statusbar .toggle.on { background: var(--active-bg); color: var(--active-ink); font-weight: 500; }
#statusbar .toggle:hover { background: var(--hover); }

.modal-bg { position: absolute; inset: 0; background: rgba(15,15,30,0.30); display: flex; align-items: center; justify-content: center; z-index: 2000; }
.modal { background: var(--panel); padding: 24px; border-radius: 10px; min-width: 320px; box-shadow: 0 8px 32px rgba(15,15,30,0.18); }
.modal h3 { margin-bottom: 14px; font-size: 14px; color: var(--ink); }
.modal .row { display: flex; gap: 8px; margin: 6px 0; align-items: center; }
.modal .row label { width: 100px; font-size: 12px; color: var(--muted); }
.modal .row input { flex: 1; background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal .actions button { background: var(--panel); color: var(--ink); border: 1px solid var(--border); padding: 6px 14px; cursor: pointer; border-radius: 6px; }
.modal .actions button.primary { background: var(--accent); color: white; border-color: var(--accent); }

#help-overlay { position: absolute; top: 12px; right: 12px; width: 360px; max-height: calc(100% - 24px); background: var(--panel); border: 1px solid var(--border); padding: 14px 18px; font-size: 12px; line-height: 1.55; overflow-y: auto; display: none; z-index: 500; border-radius: 10px; box-shadow: 0 8px 32px rgba(15,15,30,0.10); }
#help-overlay h3 { margin: 10px 0 4px; color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
#help-overlay code { background: var(--panel-2); padding: 1px 5px; border-radius: 3px; color: var(--ink); font-family: "SF Mono", "Menlo", monospace; font-size: 11px; border: 1px solid var(--border); }
#help-overlay table { font-size: 11px; width: 100%; }
#help-overlay td { padding: 3px 6px; color: var(--ink-2); }
#help-overlay td:first-child { width: 75px; }

.components-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.components-grid .comp { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; gap: 2px; transition: background 80ms; }
.components-grid .comp:hover { background: var(--hover); border-color: var(--accent); }
.components-grid .comp svg { width: 36px; height: 36px; }
.components-grid .comp .label { font-size: 9px; color: var(--muted); text-align: center; }

#tooltip {
  position: fixed;
  background: #1a1a1f;
  color: #f5f5f7;
  padding: 8px 11px;
  border-radius: 6px;
  font-size: 12px;
  pointer-events: none;
  z-index: 3000;
  max-width: 260px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18), 0 1px 3px rgba(0,0,0,0.10);
  line-height: 1.45;
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 90ms ease, transform 90ms ease;
}
#tooltip.show { opacity: 1; transform: translateX(0); }
#tooltip .tt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#tooltip .tt-name { font-weight: 600; color: #ffffff; font-size: 12px; }
#tooltip .tt-key { background: rgba(255,255,255,0.10); padding: 1px 6px; border-radius: 3px; font-family: "SF Mono", "Menlo", monospace; font-size: 10px; color: #b5c0e8; flex-shrink: 0; }
#tooltip .tt-desc { color: rgba(255,255,255,0.62); font-size: 11px; margin-top: 4px; }
#tooltip::before {
  content: ''; position: absolute;
  border: 5px solid transparent;
}
#tooltip.arrow-left::before { left: -5px; top: 50%; transform: translateY(-50%); border-right-color: #1a1a1f; }
#tooltip.arrow-top::before { top: -5px; left: 16px; border-bottom-color: #1a1a1f; }
#tooltip.arrow-bottom::before { bottom: -5px; left: 16px; border-top-color: #1a1a1f; }
</style>
</head>
<body>

<div id="topbar">
  <button id="btn-new" data-tt-name="New Drawing" data-tt-desc="Discard current drawing and start a fresh empty canvas.">New</button>
  <button id="btn-open" data-tt-name="Open File" data-tt-key="Ctrl+O" data-tt-desc="Load a previously saved drawing from a JSON file on your computer.">Open</button>
  <button id="btn-save" data-tt-name="Save File" data-tt-key="Ctrl+S" data-tt-desc="Save the current drawing as a JSON file. Stays on your machine — nothing uploaded.">Save</button>
  <button id="btn-export-svg" data-tt-name="Export SVG" data-tt-desc="Export drawing as a scalable vector graphic. Good for printing or sharing.">SVG</button>
  <button id="btn-export-png" data-tt-name="Export PNG" data-tt-desc="Export the current view as a raster image (high-DPI).">PNG</button>
  <div class="sep"></div>
  <button id="btn-undo" data-tt-name="Undo" data-tt-key="Ctrl+Z" data-tt-desc="Step back through recent edits (up to 100 levels).">↶ Undo</button>
  <button id="btn-redo" data-tt-name="Redo" data-tt-key="Ctrl+Y" data-tt-desc="Reapply an action you just undid.">↷ Redo</button>
  <div class="sep"></div>
  <button id="btn-zoom-extents" data-tt-name="Zoom Extents" data-tt-key="ZE" data-tt-desc="Fit all visible objects into the viewport.">Zoom Ext</button>
  <button id="btn-zoom-in" data-tt-name="Zoom In" data-tt-desc="Zoom in around the canvas center.">+</button>
  <button id="btn-zoom-out" data-tt-name="Zoom Out" data-tt-desc="Zoom out around the canvas center.">−</button>
  <div class="sep"></div>
  <span class="group-label">Units:</span>
  <select id="units-select">
    <option value="mm">mm</option>
    <option value="cm">cm</option>
    <option value="m">m</option>
    <option value="in">in</option>
    <option value="ft" selected>ft</option>
  </select>
  <div class="sep"></div>
  <button id="btn-theme" data-tt-name="Toggle Theme" data-tt-desc="Switch between Rayon-style light theme and a dark theme. Choice is saved.">◐</button>
  <button id="btn-help" data-tt-name="Help" data-tt-desc="Show all keyboard shortcuts and command-line aliases in a side panel.">? Help</button>
</div>

<div id="main">

  <div id="canvas-wrap">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="help-overlay"></div>
    <div id="toolbar">
      <div class="tb-row">
        <button data-tool="select" data-tt-name="Select" data-tt-key="S / Esc" data-tt-desc="Pick objects to edit. Click for one, Shift-click to add, drag a window to select many. Drag right-to-left for crossing select.">▭</button>
        <div class="tool-sep"></div>
        <button data-tool="wall" data-tt-name="Wall" data-tt-key="W" data-tt-desc="Draw walls with thickness and auto-mitered corners. Click each corner; Enter to end, C to close. Asks for thickness on activation." style="font-weight:700">▥</button>
        <button data-tool="door" data-tt-name="Door" data-tt-key="D" data-tt-desc="Place a door with its swing arc. Click the hinge point on a wall, then click the direction it opens. Auto-aligns to the nearest wall.">⌒↤</button>
        <button data-tool="window" data-tt-name="Window" data-tt-key="WIN" data-tt-desc="Insert a window into a wall as a double-line glass with frame caps. Click two points along the wall.">▦</button>
        <button data-tool="room" data-tt-name="Room" data-tt-key="R" data-tt-desc="Click inside a closed area bounded by walls or lines — auto-detects the boundary and labels the room with a name and computed area in sq ft.">⌂</button>
        <button data-tool="zone" data-tt-name="Zone" data-tt-key="Z" data-tt-desc="Draw a polygon manually to define a zone (e.g. yard, lot, outdoor area). Click each corner; Enter or C to close. Auto-labels with name and area in ft².">⬡</button>
        <div class="tool-sep"></div>
        <button data-tool="line" data-tt-name="Line" data-tt-key="L" data-tt-desc="Draws line segments. Click each endpoint; the next line continues from the last point. Enter to end.">/</button>
        <button data-tool="polyline" data-tt-name="Polyline" data-tt-key="PL" data-tt-desc="A connected chain of line segments treated as one object. Press C to close, Enter to finish.">⌇</button>
        <button data-tool="rectangle" data-tt-name="Rectangle" data-tt-key="REC" data-tt-desc="Draw a rectangle by clicking two opposite corners.">▢</button>
        <button data-tool="circle" data-tt-name="Circle" data-tt-key="C" data-tt-desc="Click the center, then click a point to set the radius.">○</button>
        <button data-tool="arc" data-tt-name="Arc (3-point)" data-tt-key="A" data-tt-desc="Click start, then any point on the arc, then the end. The arc is fit through all three points.">⌒</button>
        <button data-tool="ellipse" data-tt-name="Ellipse" data-tt-key="EL" data-tt-desc="Click the center, then the end of one axis, then the distance to the other axis.">⬭</button>
      </div>
      <div class="tb-row">
        <button data-tool="text" data-tt-name="Text" data-tt-key="T" data-tt-desc="Place a single line of text. Click position, type the text, then enter the height.">T</button>
        <button data-tool="dimension" data-tt-name="Linear Dimension" data-tt-key="DLI" data-tt-desc="Measure distance between two points. Click first extension point, second point, then where the dim line should sit. Auto-formats in feet/inches.">↔</button>
        <button data-tool="hatch" data-tt-name="Hatch" data-tt-key="H" data-tt-desc="Fill a closed polyline with a solid color or angled line pattern. Pick the closed boundary first.">▦</button>
        <div class="tool-sep"></div>
        <button data-tool="erase" data-tt-name="Erase" data-tt-key="E / Delete" data-tt-desc="Delete objects by clicking them, or select first and press Delete.">✕</button>
        <button data-tool="move" data-tt-name="Move" data-tt-key="M" data-tt-desc="Select objects, click a base point, then click the destination. Live ghost preview shows where things will land.">⤧</button>
        <button data-tool="copy" data-tt-name="Copy" data-tt-key="CO" data-tt-desc="Like Move but creates duplicates. Stays active so you can drop multiple copies. Esc to finish.">⎘</button>
        <button data-tool="rotate" data-tt-name="Rotate" data-tt-key="RO" data-tt-desc="Select, click a pivot point, then click to set the rotation angle.">↻</button>
        <button data-tool="mirror" data-tt-name="Mirror" data-tt-key="MI" data-tt-desc="Flip objects across a line. Select, click the two endpoints of the mirror line. Choose to keep or delete the source.">⇋</button>
        <button data-tool="scale" data-tt-name="Scale" data-tt-key="SC" data-tt-desc="Resize objects uniformly around a base point. Drag distance from base sets the scale factor.">⤢</button>
        <button data-tool="offset" data-tt-name="Offset" data-tt-key="O" data-tt-desc="Create a parallel copy of an object at a fixed distance. Type the distance, click an object, then click which side to offset toward.">⫽</button>
        <button data-tool="trim" data-tt-name="Trim" data-tt-key="TR" data-tt-desc="Cut a line or circle at its intersections with other objects. Click the segment you want to remove.">⌧</button>
        <button data-tool="fillet" data-tt-name="Fillet" data-tt-key="F" data-tt-desc="Round a corner between two lines with an arc of given radius. Type radius, click each line.">⌐</button>
      </div>
    </div>
  </div>

  <div id="right-panel">
    <div class="panel-section">
      <div class="panel-header"><span class="ph-title">Layers</span><button id="layer-add">+</button></div>
      <div class="panel-body" id="layers-list"></div>
    </div>
    <div class="panel-section">
      <div class="panel-header"><span class="ph-title">Properties</span></div>
      <div class="panel-body" id="properties"></div>
    </div>
    <div class="panel-section">
      <div class="panel-header"><span class="ph-title">Components</span></div>
      <div class="panel-body" id="components-list"></div>
    </div>
    <div class="panel-section collapsed">
      <div class="panel-header"><span class="ph-title">Object Snap</span></div>
      <div class="panel-body" id="snap-options"></div>
    </div>
  </div>
</div>

<div id="bottom">
  <div id="cmdhistory"></div>
  <div id="cmdline">
    <span class="prompt" id="cmd-prompt">Command:</span>
    <input id="cmd-input" autocomplete="off" spellcheck="false" placeholder="Type a command (L, C, REC, M, ...) or click a tool">
  </div>
  <div id="statusbar">
    <span id="coords">0.0000, 0.0000</span>
    <span class="toggle on" id="t-grid" data-tt-name="Grid" data-tt-key="F7" data-tt-desc="Show or hide the background grid (minor + major lines).">GRID</span>
    <span class="toggle" id="t-ortho" data-tt-name="Ortho" data-tt-key="F8" data-tt-desc="Constrain the cursor to horizontal or vertical only — pick whichever axis is closer.">ORTHO</span>
    <span class="toggle on" id="t-snap" data-tt-name="Object Snap" data-tt-key="F3" data-tt-desc="Snap the cursor to endpoints, midpoints, centers, intersections, and alignment guides.">SNAP</span>
    <span class="toggle" id="t-polar" data-tt-name="Polar Tracking" data-tt-key="F10" data-tt-desc="Constrain the cursor to multiples of 45° from the last point.">POLAR</span>
    <span id="zoom-info">100%</span>
    <span id="entity-count">0 entities</span>
    <span id="rooms-info"></span>
    <span id="status-tool" style="margin-left:auto">SELECT</span>
  </div>
</div>

<div id="tooltip"></div>

<input type="file" id="file-input" accept=".json" style="display:none">

<script>
'use strict';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  entities: new Map(),
  layers: new Map(),
  activeLayerId: null,
  selection: new Set(),
  viewport: { x: 0, y: 0, scale: 20 }, // scale = pixels per world unit
  grid: { enabled: true, size: 1, majorEvery: 10 },
  ortho: false,
  polar: false,
  polarAngles: [0, 45, 90, 135, 180, 225, 270, 315],
  snapEnabled: true,
  snapTypes: { endpoint: true, midpoint: true, center: true, intersection: true, perpendicular: true, quadrant: true, grid: true, nearest: false },
  snapDistance: 12, // pixels
  units: 'ft',
  activeTool: null,
  cursor: { world: { x: 0, y: 0 }, screen: { x: 0, y: 0 }, snap: null },
  history: [],
  historyIndex: -1,
  isDirty: false,
  clipboard: [],
};

let canvas, ctx;
let nextId = 1;
const newId = () => 'e' + (nextId++);

/* ============================================================
   GEOMETRY UTILITIES
   ============================================================ */
const G = {
  dist: (a, b) => Math.hypot(b.x - a.x, b.y - a.y),
  angle: (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, s) => ({ x: a.x * s, y: a.y * s }),
  rot: (p, c, ang) => {
    const cs = Math.cos(ang), sn = Math.sin(ang);
    const dx = p.x - c.x, dy = p.y - c.y;
    return { x: c.x + dx * cs - dy * sn, y: c.y + dx * sn + dy * cs };
  },
  scaleAbout: (p, c, s) => ({ x: c.x + (p.x - c.x) * s, y: c.y + (p.y - c.y) * s }),
  mirrorAbout: (p, a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return { x: 2 * a.x - p.x, y: 2 * a.y - p.y };
    const t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
    const fx = a.x + t * dx, fy = a.y + t * dy;
    return { x: 2 * fx - p.x, y: 2 * fy - p.y };
  },
  // closest point on segment ab to p
  closestOnSegment: (p, a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return { ...a };
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return { x: a.x + t * dx, y: a.y + t * dy };
  },
  // closest point on infinite line through a,b
  closestOnLine: (p, a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return { ...a };
    const t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
    return { x: a.x + t * dx, y: a.y + t * dy };
  },
  // line-line intersection (segments). Returns null or {x,y,t1,t2}
  segSegIntersect: (a, b, c, d) => {
    const r = { x: b.x - a.x, y: b.y - a.y };
    const s = { x: d.x - c.x, y: d.y - c.y };
    const denom = r.x * s.y - r.y * s.x;
    if (Math.abs(denom) < 1e-10) return null;
    const t = ((c.x - a.x) * s.y - (c.y - a.y) * s.x) / denom;
    const u = ((c.x - a.x) * r.y - (c.y - a.y) * r.x) / denom;
    if (t < -1e-9 || t > 1 + 1e-9 || u < -1e-9 || u > 1 + 1e-9) return null;
    return { x: a.x + t * r.x, y: a.y + t * r.y, t, u };
  },
  // infinite line intersection
  lineLineIntersect: (a, b, c, d) => {
    const r = { x: b.x - a.x, y: b.y - a.y };
    const s = { x: d.x - c.x, y: d.y - c.y };
    const denom = r.x * s.y - r.y * s.x;
    if (Math.abs(denom) < 1e-10) return null;
    const t = ((c.x - a.x) * s.y - (c.y - a.y) * s.x) / denom;
    return { x: a.x + t * r.x, y: a.y + t * r.y, t };
  },
  // line-circle intersection. Returns array of {x,y}
  lineCircleIntersect: (a, b, c, r) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const fx = a.x - c.x, fy = a.y - c.y;
    const A = dx * dx + dy * dy;
    const B = 2 * (fx * dx + fy * dy);
    const C = fx * fx + fy * fy - r * r;
    const disc = B * B - 4 * A * C;
    if (disc < 0) return [];
    const sq = Math.sqrt(disc);
    const t1 = (-B - sq) / (2 * A);
    const t2 = (-B + sq) / (2 * A);
    const out = [];
    if (t1 >= -1e-9 && t1 <= 1 + 1e-9) out.push({ x: a.x + t1 * dx, y: a.y + t1 * dy, t: t1 });
    if (t2 >= -1e-9 && t2 <= 1 + 1e-9 && Math.abs(t1 - t2) > 1e-9) out.push({ x: a.x + t2 * dx, y: a.y + t2 * dy, t: t2 });
    return out;
  },
  // returns true if angle theta is within arc from sa to ea (CCW)
  angleInArc: (theta, sa, ea) => {
    const norm = (a) => { while (a < 0) a += Math.PI * 2; while (a >= Math.PI * 2) a -= Math.PI * 2; return a; };
    let s = norm(sa), e = norm(ea), t = norm(theta);
    if (e < s) e += Math.PI * 2;
    if (t < s) t += Math.PI * 2;
    return t <= e + 1e-9;
  },
  pointInPoly: (p, pts) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  },
  // perpendicular point from external point onto a line through a,b
  perpendicularToLine: (p, a, b) => G.closestOnLine(p, a, b),
  snapAngle: (from, to, step = Math.PI / 4) => {
    const d = G.dist(from, to);
    const a = G.angle(from, to);
    const snapped = Math.round(a / step) * step;
    return { x: from.x + d * Math.cos(snapped), y: from.y + d * Math.sin(snapped) };
  },
};

/* ============================================================
   TRANSFORMS
   ============================================================ */
function w2s(p) {
  return {
    x: (p.x - state.viewport.x) * state.viewport.scale + CW() / 2,
    y: CH() / 2 - (p.y - state.viewport.y) * state.viewport.scale,
  };
}
function s2w(p) {
  return {
    x: (p.x - CW() / 2) / state.viewport.scale + state.viewport.x,
    y: state.viewport.y - (p.y - CH() / 2) / state.viewport.scale,
  };
}
function pxToWorld(px) { return px / state.viewport.scale; }

/* ============================================================
   LAYERS
   ============================================================ */
function addLayer(name, color) {
  const id = 'L' + state.layers.size;
  const layer = { id, name: name || ('Layer ' + state.layers.size), color: color || '#dddddd', visible: true, locked: false, lineWeight: 1 };
  state.layers.set(id, layer);
  if (!state.activeLayerId) state.activeLayerId = id;
  return layer;
}
function deleteLayer(id) {
  if (state.layers.size <= 1) { logMsg('Cannot delete last layer', 'err'); return; }
  // Move entities on this layer to active or first remaining
  const remaining = [...state.layers.keys()].filter(x => x !== id);
  const target = remaining.includes(state.activeLayerId) ? state.activeLayerId : remaining[0];
  for (const ent of state.entities.values()) if (ent.layer === id) ent.layer = target;
  state.layers.delete(id);
  if (state.activeLayerId === id) state.activeLayerId = target;
}

/* ============================================================
   ENTITIES
   ============================================================ */
const Ent = {
  bbox(e) {
    switch (e.type) {
      case 'line': {
        let xs = [e.x1, e.x2], ys = [e.y1, e.y2];
        if (e.bulge && Math.abs(e.bulge) > 1e-6) {
          const mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
          const dx = e.x2 - e.x1, dy = e.y2 - e.y1, l = Math.hypot(dx, dy) || 1;
          const nx = -dy / l, ny = dx / l;
          xs.push(mx + e.bulge * nx); ys.push(my + e.bulge * ny);
        }
        return { min: { x: Math.min(...xs), y: Math.min(...ys) }, max: { x: Math.max(...xs), y: Math.max(...ys) } };
      }
      case 'polyline': {
        let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
        for (const p of e.points) { mnx = Math.min(mnx, p.x); mny = Math.min(mny, p.y); mxx = Math.max(mxx, p.x); mxy = Math.max(mxy, p.y); }
        return { min: { x: mnx, y: mny }, max: { x: mxx, y: mxy } };
      }
      case 'circle': return { min: { x: e.cx - e.r, y: e.cy - e.r }, max: { x: e.cx + e.r, y: e.cy + e.r } };
      case 'arc': return { min: { x: e.cx - e.r, y: e.cy - e.r }, max: { x: e.cx + e.r, y: e.cy + e.r } }; // approx
      case 'ellipse': return { min: { x: e.cx - Math.max(e.rx, e.ry), y: e.cy - Math.max(e.rx, e.ry) }, max: { x: e.cx + Math.max(e.rx, e.ry), y: e.cy + Math.max(e.rx, e.ry) } };
      case 'text': return { min: { x: e.x, y: e.y }, max: { x: e.x + (e.text.length * e.height * 0.6), y: e.y + e.height } };
      case 'dimension': {
        const pts = [e.p1, e.p2, e.dimLinePt];
        let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
        for (const p of pts) { mnx = Math.min(mnx, p.x); mny = Math.min(mny, p.y); mxx = Math.max(mxx, p.x); mxy = Math.max(mxy, p.y); }
        return { min: { x: mnx, y: mny }, max: { x: mxx, y: mxy } };
      }
      case 'hatch': {
        let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
        for (const p of e.points) { mnx = Math.min(mnx, p.x); mny = Math.min(mny, p.y); mxx = Math.max(mxx, p.x); mxy = Math.max(mxy, p.y); }
        return { min: { x: mnx, y: mny }, max: { x: mxx, y: mxy } };
      }
      case 'wall': {
        let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
        const t = (e.thickness || 0.5) / 2;
        for (const p of e.points) { mnx = Math.min(mnx, p.x - t); mny = Math.min(mny, p.y - t); mxx = Math.max(mxx, p.x + t); mxy = Math.max(mxy, p.y + t); }
        return { min: { x: mnx, y: mny }, max: { x: mxx, y: mxy } };
      }
      case 'door': {
        const r = e.width;
        return { min: { x: e.x - r, y: e.y - r }, max: { x: e.x + r, y: e.y + r } };
      }
      case 'window': {
        const dx = Math.cos(e.wallAngle) * e.width, dy = Math.sin(e.wallAngle) * e.width;
        const t = (e.thickness || 0.5) / 2;
        const xs = [e.x, e.x + dx], ys = [e.y, e.y + dy];
        return { min: { x: Math.min(...xs) - t, y: Math.min(...ys) - t }, max: { x: Math.max(...xs) + t, y: Math.max(...ys) + t } };
      }
      case 'room': {
        let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
        for (const p of e.boundary) { mnx = Math.min(mnx, p.x); mny = Math.min(mny, p.y); mxx = Math.max(mxx, p.x); mxy = Math.max(mxy, p.y); }
        return { min: { x: mnx, y: mny }, max: { x: mxx, y: mxy } };
      }
    }
  },

  // Snap points an entity provides
  snapPoints(e) {
    const out = [];
    switch (e.type) {
      case 'line':
        out.push({ type: 'endpoint', x: e.x1, y: e.y1 });
        out.push({ type: 'endpoint', x: e.x2, y: e.y2 });
        if (e.bulge && Math.abs(e.bulge) > 1e-6) {
          const mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
          const dx = e.x2 - e.x1, dy = e.y2 - e.y1, l = Math.hypot(dx, dy) || 1;
          out.push({ type: 'midpoint', x: mx + e.bulge * (-dy / l), y: my + e.bulge * (dx / l) });
        } else {
          out.push({ type: 'midpoint', x: (e.x1 + e.x2) / 2, y: (e.y1 + e.y2) / 2 });
        }
        break;
      case 'polyline':
        for (let i = 0; i < e.points.length; i++) {
          out.push({ type: 'endpoint', x: e.points[i].x, y: e.points[i].y });
          const next = e.points[i + 1] || (e.closed ? e.points[0] : null);
          if (next) out.push({ type: 'midpoint', x: (e.points[i].x + next.x) / 2, y: (e.points[i].y + next.y) / 2 });
        }
        break;
      case 'circle':
        out.push({ type: 'center', x: e.cx, y: e.cy });
        out.push({ type: 'quadrant', x: e.cx + e.r, y: e.cy });
        out.push({ type: 'quadrant', x: e.cx - e.r, y: e.cy });
        out.push({ type: 'quadrant', x: e.cx, y: e.cy + e.r });
        out.push({ type: 'quadrant', x: e.cx, y: e.cy - e.r });
        break;
      case 'arc':
        out.push({ type: 'center', x: e.cx, y: e.cy });
        out.push({ type: 'endpoint', x: e.cx + e.r * Math.cos(e.startAngle), y: e.cy + e.r * Math.sin(e.startAngle) });
        out.push({ type: 'endpoint', x: e.cx + e.r * Math.cos(e.endAngle), y: e.cy + e.r * Math.sin(e.endAngle) });
        const midA = (e.startAngle + e.endAngle) / 2;
        out.push({ type: 'midpoint', x: e.cx + e.r * Math.cos(midA), y: e.cy + e.r * Math.sin(midA) });
        break;
      case 'ellipse':
        out.push({ type: 'center', x: e.cx, y: e.cy });
        break;
      case 'text': out.push({ type: 'endpoint', x: e.x, y: e.y }); break;
      case 'dimension':
        out.push({ type: 'endpoint', x: e.p1.x, y: e.p1.y });
        out.push({ type: 'endpoint', x: e.p2.x, y: e.p2.y });
        break;
      case 'hatch':
        for (const p of e.points) out.push({ type: 'endpoint', x: p.x, y: p.y });
        break;
      case 'wall':
        for (let i = 0; i < e.points.length; i++) {
          out.push({ type: 'endpoint', x: e.points[i].x, y: e.points[i].y });
          if (i < e.points.length - 1) {
            out.push({ type: 'midpoint', x: (e.points[i].x + e.points[i + 1].x) / 2, y: (e.points[i].y + e.points[i + 1].y) / 2 });
          }
        }
        break;
      case 'door': {
        out.push({ type: 'endpoint', x: e.x, y: e.y });
        const ex = e.x + Math.cos(e.wallAngle) * e.width;
        const ey = e.y + Math.sin(e.wallAngle) * e.width;
        out.push({ type: 'endpoint', x: ex, y: ey });
        out.push({ type: 'midpoint', x: (e.x + ex) / 2, y: (e.y + ey) / 2 });
        break;
      }
      case 'window': {
        const ex = e.x + Math.cos(e.wallAngle) * e.width;
        const ey = e.y + Math.sin(e.wallAngle) * e.width;
        out.push({ type: 'endpoint', x: e.x, y: e.y });
        out.push({ type: 'endpoint', x: ex, y: ey });
        out.push({ type: 'midpoint', x: (e.x + ex) / 2, y: (e.y + ey) / 2 });
        break;
      }
      case 'room':
        for (const p of e.boundary) out.push({ type: 'endpoint', x: p.x, y: p.y });
        if (e.labelPos) out.push({ type: 'center', x: e.labelPos.x, y: e.labelPos.y });
        break;
    }
    return out;
  },

  // returns nearest point on entity (for nearest snap and perpendicular checks) or null
  nearestPoint(e, p) {
    switch (e.type) {
      case 'line': return G.closestOnSegment(p, { x: e.x1, y: e.y1 }, { x: e.x2, y: e.y2 });
      case 'polyline': {
        let best = null, bd = Infinity;
        for (let i = 0; i < e.points.length - 1; i++) {
          const c = G.closestOnSegment(p, e.points[i], e.points[i + 1]);
          const d = G.dist(p, c);
          if (d < bd) { bd = d; best = c; }
        }
        if (e.closed && e.points.length > 1) {
          const c = G.closestOnSegment(p, e.points[e.points.length - 1], e.points[0]);
          const d = G.dist(p, c);
          if (d < bd) best = c;
        }
        return best;
      }
      case 'circle': {
        const ang = G.angle({ x: e.cx, y: e.cy }, p);
        return { x: e.cx + e.r * Math.cos(ang), y: e.cy + e.r * Math.sin(ang) };
      }
      case 'arc': {
        const ang = G.angle({ x: e.cx, y: e.cy }, p);
        if (G.angleInArc(ang, e.startAngle, e.endAngle)) {
          return { x: e.cx + e.r * Math.cos(ang), y: e.cy + e.r * Math.sin(ang) };
        } else {
          const e1 = { x: e.cx + e.r * Math.cos(e.startAngle), y: e.cy + e.r * Math.sin(e.startAngle) };
          const e2 = { x: e.cx + e.r * Math.cos(e.endAngle), y: e.cy + e.r * Math.sin(e.endAngle) };
          return G.dist(p, e1) < G.dist(p, e2) ? e1 : e2;
        }
      }
      case 'wall': {
        let best = null, bd = Infinity;
        for (let i = 0; i < e.points.length - 1; i++) {
          const c = G.closestOnSegment(p, e.points[i], e.points[i + 1]);
          const d = G.dist(p, c);
          if (d < bd) { bd = d; best = c; }
        }
        return best;
      }
      case 'door': {
        const ex = e.x + Math.cos(e.wallAngle) * e.width;
        const ey = e.y + Math.sin(e.wallAngle) * e.width;
        return G.closestOnSegment(p, { x: e.x, y: e.y }, { x: ex, y: ey });
      }
      case 'window': {
        const ex = e.x + Math.cos(e.wallAngle) * e.width;
        const ey = e.y + Math.sin(e.wallAngle) * e.width;
        return G.closestOnSegment(p, { x: e.x, y: e.y }, { x: ex, y: ey });
      }
      case 'room': {
        let best = null, bd = Infinity;
        for (let i = 0; i < e.boundary.length; i++) {
          const a = e.boundary[i], b = e.boundary[(i + 1) % e.boundary.length];
          const c = G.closestOnSegment(p, a, b);
          const d = G.dist(p, c);
          if (d < bd) { bd = d; best = c; }
        }
        return best;
      }
      default: return null;
    }
  },

  // hit test - returns true if p is within tolerance of entity
  hitTest(e, p, tol) {
    const np = Ent.nearestPoint(e, p);
    if (np && G.dist(np, p) <= tol) return true;
    if (e.type === 'text') {
      const w = e.text.length * e.height * 0.6, h = e.height;
      return p.x >= e.x - tol && p.x <= e.x + w + tol && p.y >= e.y - tol && p.y <= e.y + h + tol;
    }
    if (e.type === 'dimension') {
      // hit on dim line
      const offsetVec = computeDimLineEnds(e);
      const np2 = G.closestOnSegment(p, offsetVec.a, offsetVec.b);
      return G.dist(np2, p) <= tol;
    }
    if (e.type === 'hatch') {
      return G.pointInPoly(p, e.points);
    }
    if (e.type === 'room') {
      // hit on label area or anywhere inside
      if (e.labelPos && G.dist(e.labelPos, p) <= tol * 4) return true;
      return G.pointInPoly(p, e.boundary);
    }
    return false;
  },

  // returns true if entity is fully inside box (for window selection)
  insideBox(e, box) {
    const bb = Ent.bbox(e);
    return bb.min.x >= box.min.x && bb.min.y >= box.min.y && bb.max.x <= box.max.x && bb.max.y <= box.max.y;
  },
  // returns true if entity intersects box (for crossing selection)
  crossesBox(e, box) {
    const bb = Ent.bbox(e);
    if (bb.max.x < box.min.x || bb.min.x > box.max.x || bb.max.y < box.min.y || bb.min.y > box.max.y) return false;
    return true;
  },

  // apply transformation
  transform(e, fn) {
    switch (e.type) {
      case 'line': {
        const a = fn({ x: e.x1, y: e.y1 }), b = fn({ x: e.x2, y: e.y2 });
        e.x1 = a.x; e.y1 = a.y; e.x2 = b.x; e.y2 = b.y; break;
      }
      case 'polyline': e.points = e.points.map(fn); break;
      case 'circle': {
        const c = fn({ x: e.cx, y: e.cy });
        e.cx = c.x; e.cy = c.y; break;
      }
      case 'arc': {
        const c = fn({ x: e.cx, y: e.cy });
        e.cx = c.x; e.cy = c.y;
        // angle changes only with rotation; let caller pass adjusted entity
        break;
      }
      case 'ellipse': {
        const c = fn({ x: e.cx, y: e.cy });
        e.cx = c.x; e.cy = c.y; break;
      }
      case 'text': {
        const p = fn({ x: e.x, y: e.y });
        e.x = p.x; e.y = p.y; break;
      }
      case 'dimension': {
        e.p1 = fn(e.p1); e.p2 = fn(e.p2); e.dimLinePt = fn(e.dimLinePt); break;
      }
      case 'hatch': e.points = e.points.map(fn); break;
      case 'wall': e.points = e.points.map(fn); break;
      case 'door':
      case 'window': {
        const a = fn({ x: e.x, y: e.y });
        const ex = e.x + Math.cos(e.wallAngle) * e.width;
        const ey = e.y + Math.sin(e.wallAngle) * e.width;
        const b = fn({ x: ex, y: ey });
        e.x = a.x; e.y = a.y;
        e.wallAngle = G.angle(a, b);
        e.width = G.dist(a, b);
        break;
      }
      case 'room':
        e.boundary = e.boundary.map(fn);
        if (e.labelPos) e.labelPos = fn(e.labelPos);
        break;
    }
  },
};

function computeDimLineEnds(d) {
  // compute offset endpoints for dim line based on dimLinePt
  const dx = d.p2.x - d.p1.x, dy = d.p2.y - d.p1.y;
  if (d.dimType === 'aligned' || d.dimType === 'linear') {
    const lineLen = Math.hypot(dx, dy) || 1;
    let nx, ny;
    if (d.dimType === 'aligned') {
      nx = -dy / lineLen; ny = dx / lineLen;
    } else {
      // linear: project dimLinePt onto perpendicular axes
      // pick whichever is more horizontal vs vertical
      if (Math.abs(dx) >= Math.abs(dy)) { nx = 0; ny = 1; } else { nx = 1; ny = 0; }
    }
    // scalar offset
    const dotO = (d.dimLinePt.x - d.p1.x) * nx + (d.dimLinePt.y - d.p1.y) * ny;
    if (d.dimType === 'aligned') {
      const a = { x: d.p1.x + nx * dotO, y: d.p1.y + ny * dotO };
      const b = { x: d.p2.x + nx * dotO, y: d.p2.y + ny * dotO };
      return { a, b };
    } else {
      // for linear, the dimension line is parallel to chosen axis
      // move both endpoints to dim line position along chosen axis
      const a = { x: nx === 0 ? d.p1.x : d.dimLinePt.x, y: ny === 0 ? d.p1.y : d.dimLinePt.y };
      const b = { x: nx === 0 ? d.p2.x : d.dimLinePt.x, y: ny === 0 ? d.p2.y : d.dimLinePt.y };
      return { a, b };
    }
  }
  return { a: d.p1, b: d.p2 };
}

/* ============================================================
   HISTORY
   ============================================================ */
function snapshot() {
  return JSON.stringify({
    entities: [...state.entities.entries()],
    layers: [...state.layers.entries()],
    activeLayerId: state.activeLayerId,
    nextId,
  });
}
function restore(snap) {
  const data = JSON.parse(snap);
  state.entities = new Map(data.entities);
  state.layers = new Map(data.layers);
  state.activeLayerId = data.activeLayerId;
  nextId = data.nextId;
  state.selection.clear();
  refreshLayersUI();
  refreshProperties();
  updateStatus();
}
function pushHistory() {
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push(snapshot());
  if (state.history.length > 100) state.history.shift();
  state.historyIndex = state.history.length - 1;
  state.isDirty = true;
  updateStatus();
  render();
}
function undo() {
  if (state.historyIndex <= 0) { logMsg('Nothing to undo', 'info'); return; }
  state.historyIndex--;
  restore(state.history[state.historyIndex]);
  logMsg('Undo', 'info');
  render();
}
function redo() {
  if (state.historyIndex >= state.history.length - 1) { logMsg('Nothing to redo', 'info'); return; }
  state.historyIndex++;
  restore(state.history[state.historyIndex]);
  logMsg('Redo', 'info');
  render();
}

/* ============================================================
   ADD / DELETE / MUTATE
   ============================================================ */
function addEntity(e) {
  if (!e.id) e.id = newId();
  if (!e.layer) e.layer = state.activeLayerId;
  state.entities.set(e.id, e);
  return e;
}
function deleteEntities(ids) {
  for (const id of ids) state.entities.delete(id);
  for (const id of ids) state.selection.delete(id);
}

/* ============================================================
   SNAP ENGINE
   ============================================================ */
const snapPriority = { endpoint: 1, midpoint: 2, intersection: 3, center: 4, quadrant: 5, perpendicular: 6, grid: 7, nearest: 8 };

function computeTracking(world) {
  if (!state.snapEnabled) { state.cursor.tracking = null; return; }
  const tolPx = 6;
  const tolWorld = pxToWorld(tolPx);
  const horiz = [], vert = [];
  let count = 0;
  for (const e of state.entities.values()) {
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible) continue;
    for (const sp of Ent.snapPoints(e)) {
      if (sp.type !== 'endpoint' && sp.type !== 'center' && sp.type !== 'midpoint' && sp.type !== 'quadrant') continue;
      if (Math.abs(sp.y - world.y) < tolWorld) horiz.push(sp);
      if (Math.abs(sp.x - world.x) < tolWorld) vert.push(sp);
      if (++count > 800) break;
    }
    if (count > 800) break;
  }
  state.cursor.tracking = { horiz, vert };
}

function drawTrackingGuides() {
  const t = state.cursor.tracking;
  if (!t) return;
  const cur = state.cursor.snap || state.cursor.world;
  ctx.save();
  ctx.strokeStyle = 'rgba(61,220,132,0.45)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.fillStyle = '#3ddc84';
  for (const p of t.horiz) {
    const a = w2s({ x: p.x, y: p.y });
    const b = w2s({ x: cur.x, y: p.y });
    ctx.beginPath();
    ctx.moveTo(Math.round(a.x) + 0.5, Math.round(a.y) + 0.5);
    ctx.lineTo(Math.round(b.x) + 0.5, Math.round(b.y) + 0.5);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(a.x, a.y, 2, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of t.vert) {
    const a = w2s({ x: p.x, y: p.y });
    const b = w2s({ x: p.x, y: cur.y });
    ctx.beginPath();
    ctx.moveTo(Math.round(a.x) + 0.5, Math.round(a.y) + 0.5);
    ctx.lineTo(Math.round(b.x) + 0.5, Math.round(b.y) + 0.5);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(a.x, a.y, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function findSnap(world) {
  if (!state.snapEnabled) return null;
  const tolPx = state.snapDistance;
  const tolWorld = pxToWorld(tolPx);
  let best = null, bestPriority = 999, bestDist = Infinity;

  // entity-based snaps
  for (const e of state.entities.values()) {
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible) continue;
    for (const sp of Ent.snapPoints(e)) {
      if (!state.snapTypes[sp.type]) continue;
      const d = G.dist(world, sp);
      if (d <= tolWorld) {
        const pr = snapPriority[sp.type];
        if (pr < bestPriority || (pr === bestPriority && d < bestDist)) {
          best = sp; bestPriority = pr; bestDist = d;
        }
      }
    }
  }

  // intersections (pairwise) - only check entities near cursor
  if (state.snapTypes.intersection) {
    const near = [];
    for (const e of state.entities.values()) {
      const layer = state.layers.get(e.layer);
      if (!layer || !layer.visible) continue;
      const bb = Ent.bbox(e);
      if (world.x >= bb.min.x - tolWorld && world.x <= bb.max.x + tolWorld &&
          world.y >= bb.min.y - tolWorld && world.y <= bb.max.y + tolWorld) {
        near.push(e);
      }
    }
    for (let i = 0; i < near.length; i++) {
      for (let j = i + 1; j < near.length; j++) {
        const pts = entityIntersect(near[i], near[j]);
        for (const p of pts) {
          const d = G.dist(world, p);
          if (d <= tolWorld) {
            const pr = snapPriority.intersection;
            if (pr < bestPriority || (pr === bestPriority && d < bestDist)) {
              best = { type: 'intersection', x: p.x, y: p.y };
              bestPriority = pr; bestDist = d;
            }
          }
        }
      }
    }
  }

  // nearest on entity
  if (state.snapTypes.nearest && !best) {
    for (const e of state.entities.values()) {
      const layer = state.layers.get(e.layer);
      if (!layer || !layer.visible) continue;
      const np = Ent.nearestPoint(e, world);
      if (np) {
        const d = G.dist(world, np);
        if (d <= tolWorld && d < bestDist) {
          best = { type: 'nearest', x: np.x, y: np.y };
          bestPriority = snapPriority.nearest;
          bestDist = d;
        }
      }
    }
  }

  // alignment tracking (X+Y intersection)
  if (!best && state.cursor.tracking) {
    const t = state.cursor.tracking;
    if (t.horiz.length > 0 && t.vert.length > 0) {
      let minD = Infinity, bp = null;
      for (const h of t.horiz) for (const v of t.vert) {
        const cand = { x: v.x, y: h.y };
        const d = G.dist(world, cand);
        if (d < minD) { minD = d; bp = cand; }
      }
      if (bp && minD < tolWorld * 1.4) best = { type: 'extension', x: bp.x, y: bp.y };
    }
  }

  // grid snap (lowest priority)
  if (state.snapTypes.grid && state.grid.enabled && !best) {
    const gx = Math.round(world.x / state.grid.size) * state.grid.size;
    const gy = Math.round(world.y / state.grid.size) * state.grid.size;
    const gp = { x: gx, y: gy };
    if (G.dist(world, gp) <= tolWorld) {
      best = { type: 'grid', x: gx, y: gy };
    }
  }

  return best;
}

function entityIntersect(a, b) {
  // return array of intersection points
  const out = [];
  const segments = (e) => {
    if (e.type === 'line') return [[{ x: e.x1, y: e.y1 }, { x: e.x2, y: e.y2 }]];
    if (e.type === 'polyline') {
      const segs = [];
      for (let i = 0; i < e.points.length - 1; i++) segs.push([e.points[i], e.points[i + 1]]);
      if (e.closed && e.points.length > 1) segs.push([e.points[e.points.length - 1], e.points[0]]);
      return segs;
    }
    return null;
  };
  const sa = segments(a), sb = segments(b);
  if (sa && sb) {
    for (const [p1, p2] of sa) for (const [p3, p4] of sb) {
      const ip = G.segSegIntersect(p1, p2, p3, p4);
      if (ip) out.push({ x: ip.x, y: ip.y });
    }
  } else if (sa && b.type === 'circle') {
    for (const [p1, p2] of sa) for (const ip of G.lineCircleIntersect(p1, p2, { x: b.cx, y: b.cy }, b.r)) out.push(ip);
  } else if (sb && a.type === 'circle') {
    for (const [p1, p2] of sb) for (const ip of G.lineCircleIntersect(p1, p2, { x: a.cx, y: a.cy }, a.r)) out.push(ip);
  } else if (a.type === 'circle' && b.type === 'circle') {
    const d = G.dist({ x: a.cx, y: a.cy }, { x: b.cx, y: b.cy });
    if (d <= a.r + b.r && d >= Math.abs(a.r - b.r) && d > 1e-9) {
      const aa = (a.r * a.r - b.r * b.r + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, a.r * a.r - aa * aa));
      const px = a.cx + aa * (b.cx - a.cx) / d;
      const py = a.cy + aa * (b.cy - a.cy) / d;
      out.push({ x: px + h * (b.cy - a.cy) / d, y: py - h * (b.cx - a.cx) / d });
      if (h > 1e-9) out.push({ x: px - h * (b.cy - a.cy) / d, y: py + h * (b.cx - a.cx) / d });
    }
  }
  return out;
}

/* ============================================================
   ORTHO / POLAR
   ============================================================ */
function applyConstraints(from, to) {
  if (state.ortho && from) {
    const dx = to.x - from.x, dy = to.y - from.y;
    if (Math.abs(dx) >= Math.abs(dy)) return { x: to.x, y: from.y };
    return { x: from.x, y: to.y };
  }
  if (state.polar && from) {
    return G.snapAngle(from, to, Math.PI / 4);
  }
  return to;
}

/* ============================================================
   RENDERER
   ============================================================ */
let DPR = 1;
function resize() {
  const wrap = document.getElementById('canvas-wrap');
  DPR = window.devicePixelRatio || 1;
  canvas.width = Math.round(wrap.clientWidth * DPR);
  canvas.height = Math.round(wrap.clientHeight * DPR);
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  render();
}
const CW = () => canvas.clientWidth;
const CH = () => canvas.clientHeight;

function themeColors() {
  const dark = document.body.classList.contains('theme-dark');
  return {
    bg: dark ? '#16161a' : '#fafafa',
    gridMinor: dark ? '#222' : '#ececef',
    gridMajor: dark ? '#2e2e2e' : '#d8d8dc',
    axisX: dark ? '#5a2a2a' : '#f3d6d6',
    axisY: dark ? '#2a5a2a' : '#d6ebd6',
    crosshair: dark ? 'rgba(200,200,210,0.16)' : 'rgba(20,20,30,0.10)',
    label: dark ? '#ccc' : '#1a1a1f',
    preview: dark ? '#888' : '#9a9aa6',
    dimBg: dark ? '#16161a' : '#fafafa',
  };
}

function render() {
  if (!ctx) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const T = themeColors();
  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, CW(), CH());
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (state.grid.enabled) drawGrid();
  drawAxes();

  // hover highlight (drawn behind selection)
  if (state.cursor.hoverId && !state.selection.has(state.cursor.hoverId)) {
    const he = state.entities.get(state.cursor.hoverId);
    if (he) drawEntity(he, false, true);
  }

  // entities — rooms first (so floor fill is under walls), then dimensions/hatch, then everything else
  const zOrder = { room: 0, hatch: 1, wall: 5, line: 5, polyline: 5, circle: 5, arc: 5, ellipse: 5, door: 6, window: 6, dimension: 7, text: 8 };
  const sortedEnts = [...state.entities.values()].sort((a, b) => (zOrder[a.type] || 5) - (zOrder[b.type] || 5));
  for (const e of sortedEnts) drawEntity(e);

  // selection highlights
  for (const id of state.selection) {
    const e = state.entities.get(id);
    if (e) drawEntity(e, true);
  }

  // tracking guides (dashed extension lines from aligned endpoints)
  drawTrackingGuides();

  // active tool preview
  if (state.activeTool && state.activeTool.drawPreview) state.activeTool.drawPreview(ctx);

  // selection box preview
  if (selectBox.active) drawSelectBox();

  // snap indicator
  if (state.cursor.snap) drawSnapIndicator(state.cursor.snap);

  // crosshair
  drawCrosshair();
}

function drawGrid() {
  const T = themeColors();
  const minor = state.grid.size;
  const major = minor * state.grid.majorEvery;
  const tl = s2w({ x: 0, y: 0 });
  const br = s2w({ x: CW(), y: CH() });
  const minX = Math.floor(tl.x / major) * major, maxX = Math.ceil(br.x / major) * major;
  const minY = Math.floor(br.y / major) * major, maxY = Math.ceil(tl.y / major) * major;
  if ((maxX - minX) / minor > 2000) return;

  ctx.lineWidth = 1;
  if (state.viewport.scale * minor > 5) {
    ctx.strokeStyle = T.gridMinor;
    ctx.beginPath();
    for (let x = minX; x <= maxX; x += minor) {
      const sx = Math.round(w2s({ x, y: 0 }).x) + 0.5;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, CH());
    }
    for (let y = minY; y <= maxY; y += minor) {
      const sy = Math.round(w2s({ x: 0, y }).y) + 0.5;
      ctx.moveTo(0, sy); ctx.lineTo(CW(), sy);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = T.gridMajor;
  ctx.beginPath();
  for (let x = minX; x <= maxX; x += major) {
    const sx = Math.round(w2s({ x, y: 0 }).x) + 0.5;
    ctx.moveTo(sx, 0); ctx.lineTo(sx, CH());
  }
  for (let y = minY; y <= maxY; y += major) {
    const sy = Math.round(w2s({ x: 0, y }).y) + 0.5;
    ctx.moveTo(0, sy); ctx.lineTo(CW(), sy);
  }
  ctx.stroke();
}

function drawAxes() {
  const T = themeColors();
  const o = w2s({ x: 0, y: 0 });
  ctx.lineWidth = 1;
  ctx.strokeStyle = T.axisX;
  const oy = Math.round(o.y) + 0.5;
  ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(CW(), oy); ctx.stroke();
  ctx.strokeStyle = T.axisY;
  const ox = Math.round(o.x) + 0.5;
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, CH()); ctx.stroke();
}

function drawCrosshair() {
  const T = themeColors();
  const c = state.cursor.snap ? w2s(state.cursor.snap) : state.cursor.screen;
  if (!c) return;
  ctx.strokeStyle = T.crosshair; ctx.lineWidth = 1;
  ctx.setLineDash([3, 5]);
  ctx.beginPath();
  const cx = Math.round(c.x) + 0.5, cy = Math.round(c.y) + 0.5;
  ctx.moveTo(0, cy); ctx.lineTo(CW(), cy);
  ctx.moveTo(cx, 0); ctx.lineTo(cx, CH());
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawSnapIndicator(snap) {
  const s = w2s(snap);
  const ACC = '#3ddc84';
  ctx.strokeStyle = ACC; ctx.lineWidth = 1.5;
  ctx.fillStyle = 'rgba(61,220,132,0.14)';
  const sz = 5;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (snap.type) {
    case 'endpoint':
      ctx.fillRect(s.x - sz, s.y - sz, sz * 2, sz * 2);
      ctx.strokeRect(s.x - sz, s.y - sz, sz * 2, sz * 2);
      break;
    case 'midpoint':
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - sz); ctx.lineTo(s.x + sz, s.y + sz); ctx.lineTo(s.x - sz, s.y + sz); ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;
    case 'center':
      ctx.beginPath(); ctx.arc(s.x, s.y, sz, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x, s.y, 1, 0, Math.PI * 2); ctx.fillStyle = ACC; ctx.fill();
      break;
    case 'quadrant':
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - sz); ctx.lineTo(s.x + sz, s.y); ctx.lineTo(s.x, s.y + sz); ctx.lineTo(s.x - sz, s.y); ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;
    case 'intersection':
      ctx.beginPath();
      ctx.moveTo(s.x - sz, s.y - sz); ctx.lineTo(s.x + sz, s.y + sz);
      ctx.moveTo(s.x - sz, s.y + sz); ctx.lineTo(s.x + sz, s.y - sz);
      ctx.stroke();
      break;
    case 'perpendicular':
      ctx.strokeRect(s.x - sz, s.y - sz, sz * 2, sz * 2);
      ctx.beginPath();
      ctx.moveTo(s.x - sz, s.y); ctx.lineTo(s.x + sz, s.y);
      ctx.moveTo(s.x, s.y - sz); ctx.lineTo(s.x, s.y);
      ctx.stroke();
      break;
    case 'nearest':
      ctx.beginPath();
      ctx.moveTo(s.x - sz, s.y - sz); ctx.lineTo(s.x + sz, s.y - sz); ctx.lineTo(s.x - sz, s.y + sz); ctx.lineTo(s.x + sz, s.y + sz); ctx.closePath();
      ctx.stroke();
      break;
    case 'grid':
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      break;
    case 'extension':
    case 'alignH':
    case 'alignV':
      ctx.beginPath();
      ctx.moveTo(s.x - sz, s.y); ctx.lineTo(s.x + sz, s.y);
      ctx.moveTo(s.x, s.y - sz); ctx.lineTo(s.x, s.y + sz);
      ctx.stroke();
      break;
  }
  // skip text label when an active tool is drawing a preview (it puts its own label there)
  if (state.activeTool && state.activeTool.drawPreview && activeToolName !== 'select' && activeToolName !== 'erase') return;
  ctx.fillStyle = ACC;
  ctx.font = '10px -apple-system, sans-serif';
  ctx.fillText(snap.type, s.x + 9, s.y - 7);
}

function drawSelectBox() {
  const a = w2s(selectBox.start);
  const b = w2s(selectBox.end);
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  const crossing = b.x < a.x;
  ctx.fillStyle = crossing ? 'rgba(0,200,0,0.1)' : 'rgba(0,120,255,0.1)';
  ctx.strokeStyle = crossing ? '#00cc00' : '#3399ff';
  ctx.lineWidth = 1;
  if (crossing) ctx.setLineDash([4, 4]);
  ctx.fillRect(x, y, w, h);
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
}

function adaptColor(color) {
  if (!color || !document.body.classList.contains('theme-dark')) return color;
  const m = /^#?([0-9a-fA-F]{6})$/.exec(color);
  if (!m) return color;
  const hex = m[1];
  const r = parseInt(hex.slice(0, 2), 16);
  const g = parseInt(hex.slice(2, 4), 16);
  const b = parseInt(hex.slice(4, 6), 16);
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  if (lum < 110) {
    // too dark for dark theme — invert toward bright
    const ir = 255 - r, ig = 255 - g, ib = 255 - b;
    return '#' + [ir, ig, ib].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  return color;
}

function drawEntity(e, highlight = false, hover = false) {
  const layer = state.layers.get(e.layer);
  if (!layer || !layer.visible) return;
  let color = adaptColor(layer.color || '#dddddd');
  if (highlight) color = '#4aa3ff';
  else if (hover) color = '#a5d4ff';
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  const baseLW = layer.lineWeight || 1;
  ctx.lineWidth = highlight ? Math.max(baseLW + 1, 2) : (hover ? baseLW + 0.5 : baseLW);

  switch (e.type) {
    case 'line': {
      if (e.bulge && Math.abs(e.bulge) > 1e-6) {
        // bent line → arc through (p1, midpoint+bulge*perp, p2)
        const mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
        const dx = e.x2 - e.x1, dy = e.y2 - e.y1, l = Math.hypot(dx, dy) || 1;
        const nx = -dy / l, ny = dx / l;
        const bp = { x: mx + e.bulge * nx, y: my + e.bulge * ny };
        const arc = arcFrom3Points({ x: e.x1, y: e.y1 }, bp, { x: e.x2, y: e.y2 });
        if (arc) {
          const c = w2s({ x: arc.cx, y: arc.cy });
          ctx.beginPath();
          ctx.arc(c.x, c.y, arc.r * state.viewport.scale, -arc.endAngle, -arc.startAngle, false);
          ctx.stroke();
          break;
        }
      }
      const a = w2s({ x: e.x1, y: e.y1 }), b = w2s({ x: e.x2, y: e.y2 });
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      break;
    }
    case 'polyline': {
      ctx.beginPath();
      for (let i = 0; i < e.points.length; i++) {
        const p = w2s(e.points[i]);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      if (e.closed) ctx.closePath();
      ctx.stroke();
      break;
    }
    case 'circle': {
      const c = w2s({ x: e.cx, y: e.cy });
      ctx.beginPath(); ctx.arc(c.x, c.y, e.r * state.viewport.scale, 0, Math.PI * 2); ctx.stroke();
      break;
    }
    case 'arc': {
      const c = w2s({ x: e.cx, y: e.cy });
      // canvas Y is flipped; draw with negated angles and counterclockwise=true
      ctx.beginPath();
      ctx.arc(c.x, c.y, e.r * state.viewport.scale, -e.endAngle, -e.startAngle, false);
      ctx.stroke();
      break;
    }
    case 'ellipse': {
      const c = w2s({ x: e.cx, y: e.cy });
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(-(e.rotation || 0));
      ctx.beginPath();
      ctx.ellipse(0, 0, e.rx * state.viewport.scale, e.ry * state.viewport.scale, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      break;
    }
    case 'text': {
      const p = w2s({ x: e.x, y: e.y + e.height });
      const px = e.height * state.viewport.scale;
      ctx.font = px + 'px sans-serif';
      ctx.save();
      ctx.translate(p.x, p.y);
      if (e.rotation) ctx.rotate(-e.rotation);
      ctx.fillText(e.text, 0, 0);
      ctx.restore();
      break;
    }
    case 'dimension': drawDimension(e, color); break;
    case 'hatch': drawHatch(e, color); break;
    case 'wall': drawWall(e, color, highlight, hover); break;
    case 'door': drawDoor(e, color); break;
    case 'window': drawWindow(e, color); break;
    case 'room': drawRoom(e, color, highlight, hover); break;
  }

  if (highlight) {
    // draw grips
    const grips = Ent.snapPoints(e).filter(s => s.type === 'endpoint' || s.type === 'center' || s.type === 'midpoint');
    ctx.fillStyle = '#3399ff';
    for (const g of grips) {
      const sp = w2s(g);
      ctx.fillRect(sp.x - 3, sp.y - 3, 6, 6);
    }
    // bulge handle for lines (drag to bend into an arc)
    if (e.type === 'line') {
      const mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
      const dx = e.x2 - e.x1, dy = e.y2 - e.y1, l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l, ny = dx / l;
      const bp = w2s({ x: mx + (e.bulge || 0) * nx, y: my + (e.bulge || 0) * ny });
      ctx.fillStyle = '#4aa3ff';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bp.x, bp.y, 5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  }
}

function drawDimension(d, color) {
  const ends = computeDimLineEnds(d);
  const a = w2s(d.p1), b = w2s(d.p2);
  const da = w2s(ends.a), db = w2s(ends.b);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  // extension lines
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(da.x, da.y);
  ctx.moveTo(b.x, b.y); ctx.lineTo(db.x, db.y);
  // dim line
  ctx.moveTo(da.x, da.y); ctx.lineTo(db.x, db.y);
  ctx.stroke();
  // arrows
  const ang = Math.atan2(db.y - da.y, db.x - da.x);
  drawArrowHead(da.x, da.y, ang);
  drawArrowHead(db.x, db.y, ang + Math.PI);
  // label
  const dist = G.dist(d.p1, d.p2);
  let labelDist = dist;
  if (d.dimType === 'linear') {
    labelDist = Math.hypot(ends.b.x - ends.a.x, ends.b.y - ends.a.y);
  }
  const label = formatLength(labelDist);
  const mid = { x: (da.x + db.x) / 2, y: (da.y + db.y) / 2 };
  ctx.fillStyle = color;
  ctx.font = '12px sans-serif';
  ctx.save();
  ctx.translate(mid.x, mid.y);
  let labAng = ang;
  if (Math.abs(labAng) > Math.PI / 2) labAng += Math.PI;
  ctx.rotate(labAng);
  const tw = ctx.measureText(label).width;
  ctx.fillStyle = themeColors().dimBg;
  ctx.fillRect(-tw / 2 - 2, -7, tw + 4, 14);
  ctx.fillStyle = color;
  ctx.fillText(label, -tw / 2, 4);
  ctx.restore();
}
function drawArrowHead(x, y, ang) {
  const sz = 8;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - sz * Math.cos(ang - 0.3), y - sz * Math.sin(ang - 0.3));
  ctx.lineTo(x - sz * Math.cos(ang + 0.3), y - sz * Math.sin(ang + 0.3));
  ctx.closePath();
  ctx.fill();
}

function drawHatch(e, color) {
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i < e.points.length; i++) {
    const p = w2s(e.points[i]);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  if (e.pattern === 'solid') {
    ctx.fillStyle = color + '55';
    ctx.fill();
  } else {
    // simple line pattern
    ctx.clip();
    const bb = Ent.bbox(e);
    const space = e.spacing || 0.5;
    const ang = e.angle || Math.PI / 4;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const minP = w2s(bb.min), maxP = w2s(bb.max);
    const step = space * state.viewport.scale;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const len = Math.hypot(CW(), CH());
    for (let t = -len; t <= len; t += step) {
      const cx = CW() / 2 + t * dy;
      const cy = CH() / 2 - t * dx;
      ctx.moveTo(cx - len * dx, cy + len * dy);
      ctx.lineTo(cx + len * dx, cy - len * dy);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function computeWallEdges(pts, thickness) {
  if (!pts || pts.length < 2) return null;
  const t = thickness / 2;
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    if (i === 0) {
      const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y, l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l, ny = dx / l;
      left.push({ x: pts[0].x + nx * t, y: pts[0].y + ny * t });
      right.push({ x: pts[0].x - nx * t, y: pts[0].y - ny * t });
    } else if (i === pts.length - 1) {
      const dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y, l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l, ny = dx / l;
      left.push({ x: pts[i].x + nx * t, y: pts[i].y + ny * t });
      right.push({ x: pts[i].x - nx * t, y: pts[i].y - ny * t });
    } else {
      const dx1 = pts[i].x - pts[i - 1].x, dy1 = pts[i].y - pts[i - 1].y, l1 = Math.hypot(dx1, dy1) || 1;
      const dx2 = pts[i + 1].x - pts[i].x, dy2 = pts[i + 1].y - pts[i].y, l2 = Math.hypot(dx2, dy2) || 1;
      const n1x = -dy1 / l1, n1y = dx1 / l1;
      const n2x = -dy2 / l2, n2y = dx2 / l2;
      let mx = n1x + n2x, my = n1y + n2y;
      const ml = Math.hypot(mx, my);
      if (ml < 1e-6) {
        left.push({ x: pts[i].x + n1x * t, y: pts[i].y + n1y * t });
        right.push({ x: pts[i].x - n1x * t, y: pts[i].y - n1y * t });
      } else {
        mx /= ml; my /= ml;
        const dot = mx * n1x + my * n1y;
        const lenL = t / Math.max(0.2, dot);
        left.push({ x: pts[i].x + mx * lenL, y: pts[i].y + my * lenL });
        right.push({ x: pts[i].x - mx * lenL, y: pts[i].y - my * lenL });
      }
    }
  }
  return { left, right };
}

function drawWall(e, color, highlight, hover) {
  const edges = computeWallEdges(e.points, e.thickness || 0.5);
  if (!edges) return;
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; ctx.miterLimit = 6;
  // edges (no body fill — clean Rayon-style two-line wall)
  ctx.strokeStyle = color;
  ctx.lineWidth = highlight ? 2.5 : (hover ? 1.5 : 1);
  for (const side of [edges.left, edges.right]) {
    ctx.beginPath();
    for (let i = 0; i < side.length; i++) {
      const p = w2s(side[i]);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  // end caps
  ctx.beginPath();
  const a0 = w2s(edges.left[0]), b0 = w2s(edges.right[0]);
  ctx.moveTo(a0.x, a0.y); ctx.lineTo(b0.x, b0.y);
  const an = w2s(edges.left[edges.left.length - 1]), bn = w2s(edges.right[edges.right.length - 1]);
  ctx.moveTo(an.x, an.y); ctx.lineTo(bn.x, bn.y);
  ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}

function drawDoor(e, color) {
  const c = w2s({ x: e.x, y: e.y });
  const r = e.width * state.viewport.scale;
  const wallAngScreen = -e.wallAngle;
  const swing = e.swing || 1;
  const openAng = (e.openAngle != null ? e.openAngle : Math.PI / 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(wallAngScreen);
  // door panel
  ctx.save();
  ctx.rotate(-swing * openAng);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(r, 0);
  ctx.stroke();
  ctx.restore();
  // swing arc
  ctx.beginPath();
  if (swing > 0) ctx.arc(0, 0, r, -openAng, 0, false);
  else ctx.arc(0, 0, r, 0, openAng, false);
  ctx.stroke();
  // hinge marker
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawWindow(e, color) {
  const a = w2s({ x: e.x, y: e.y });
  const ex = e.x + Math.cos(e.wallAngle) * e.width;
  const ey = e.y + Math.sin(e.wallAngle) * e.width;
  const b = w2s({ x: ex, y: ey });
  const t = (e.thickness || 0.5) / 2;
  // perpendicular offset in world
  const perp = { x: -Math.sin(e.wallAngle) * t, y: Math.cos(e.wallAngle) * t };
  const aL = w2s({ x: e.x + perp.x, y: e.y + perp.y });
  const aR = w2s({ x: e.x - perp.x, y: e.y - perp.y });
  const bL = w2s({ x: ex + perp.x, y: ey + perp.y });
  const bR = w2s({ x: ex - perp.x, y: ey - perp.y });
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  // outer frames
  ctx.moveTo(aL.x, aL.y); ctx.lineTo(bL.x, bL.y);
  ctx.moveTo(aR.x, aR.y); ctx.lineTo(bR.x, bR.y);
  // glass center line
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  // end caps
  ctx.moveTo(aL.x, aL.y); ctx.lineTo(aR.x, aR.y);
  ctx.moveTo(bL.x, bL.y); ctx.lineTo(bR.x, bR.y);
  ctx.stroke();
}

function formatLength(d) {
  if (state.units === 'ft') {
    const f = Math.floor(d);
    const i = (d - f) * 12;
    return `${f}'-${i.toFixed(2)}"`;
  }
  return d.toFixed(3) + ' ' + state.units;
}

/* ============================================================
   SELECTION
   ============================================================ */
const selectBox = { active: false, start: null, end: null };

function selectAt(world) {
  const tol = pxToWorld(6);
  // pick last (topmost) entity hit
  const entries = [...state.entities.values()].reverse();
  for (const e of entries) {
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible || layer.locked) continue;
    if (Ent.hitTest(e, world, tol)) return e.id;
  }
  return null;
}

function selectInBox(start, end) {
  const crossing = end.x < start.x;
  const box = {
    min: { x: Math.min(start.x, end.x), y: Math.min(start.y, end.y) },
    max: { x: Math.max(start.x, end.x), y: Math.max(start.y, end.y) },
  };
  const out = [];
  for (const e of state.entities.values()) {
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible || layer.locked) continue;
    if (crossing ? Ent.crossesBox(e, box) : Ent.insideBox(e, box)) out.push(e.id);
  }
  return out;
}

/* ============================================================
   TOOLS
   ============================================================ */
const tools = {};
let activeToolName = null;

function setTool(name, opts = {}) {
  if (state.activeTool && state.activeTool.onDeactivate) state.activeTool.onDeactivate();
  if (!tools[name]) name = 'select';
  activeToolName = name;
  state.activeTool = Object.assign({}, tools[name]);
  state.activeTool.opts = opts;
  if (state.activeTool.onActivate) state.activeTool.onActivate(opts);
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === name);
  });
  document.getElementById('status-tool').textContent = name.toUpperCase();
  setPrompt(state.activeTool.prompt || 'Command:');
  render();
}

function setPrompt(s) { document.getElementById('cmd-prompt').textContent = s; }

const bulgeDrag = { active: false, lineId: null };

function hitBulgeHandle(world) {
  const tol = pxToWorld(8);
  for (const id of state.selection) {
    const e = state.entities.get(id);
    if (!e || e.type !== 'line') continue;
    const layer = state.layers.get(e.layer);
    if (!layer || layer.locked) continue;
    const mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
    const dx = e.x2 - e.x1, dy = e.y2 - e.y1, l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l;
    const bp = { x: mx + (e.bulge || 0) * nx, y: my + (e.bulge || 0) * ny };
    if (G.dist(world, bp) <= tol) return id;
  }
  return null;
}

/* ----- SELECT TOOL ----- */
tools.select = {
  prompt: 'Select objects:',
  onActivate() { canvas.style.cursor = 'default'; },
  onMouseDown(world, screen, ev) {
    if (ev.button !== 0) return;
    // bulge handle takes priority over normal selection
    const handleId = hitBulgeHandle(world);
    if (handleId) {
      bulgeDrag.active = true;
      bulgeDrag.lineId = handleId;
      return;
    }
    const id = selectAt(world);
    if (id) {
      if (!ev.shiftKey) state.selection.clear();
      if (state.selection.has(id) && ev.shiftKey) state.selection.delete(id);
      else state.selection.add(id);
      refreshProperties();
    } else {
      if (!ev.shiftKey) state.selection.clear();
      selectBox.active = true;
      selectBox.start = { ...world };
      selectBox.end = { ...world };
    }
  },
  onMouseMove(world) {
    if (bulgeDrag.active) {
      const e = state.entities.get(bulgeDrag.lineId);
      if (!e) { bulgeDrag.active = false; return; }
      const mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
      const dx = e.x2 - e.x1, dy = e.y2 - e.y1, l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l, ny = dx / l;
      const wp = state.cursor.snap || world;
      // perpendicular component of (wp - midpoint) along (nx, ny)
      e.bulge = (wp.x - mx) * nx + (wp.y - my) * ny;
      // snap small bulge values to exactly 0 (straight line)
      if (Math.abs(e.bulge) < pxToWorld(4)) e.bulge = 0;
      return;
    }
    if (selectBox.active) selectBox.end = { ...world };
  },
  onMouseUp(world, screen, ev) {
    if (bulgeDrag.active) {
      bulgeDrag.active = false;
      pushHistory();
      return;
    }
    if (selectBox.active) {
      const ids = selectInBox(selectBox.start, selectBox.end);
      for (const id of ids) state.selection.add(id);
      selectBox.active = false;
      refreshProperties();
    }
  },
  onKeyDown(ev) {
    if (ev.key === 'Delete' || ev.key === 'Backspace') {
      if (state.selection.size > 0) {
        const count = state.selection.size;
        deleteEntities([...state.selection]);
        pushHistory();
        refreshProperties();
        render();
        logMsg('Deleted ' + count + ' object(s)', 'info');
      }
    }
  },
};

  onMouseDown(world, screen, ev) {

    let p = state.cursor.snap || world;
    if (this.state.points.length > 0) p = applyConstraints(this.state.points[this.state.points.length - 1], p);
    this.state.points.push(p);
    if (this.state.points.length >= 2) {
      const a = this.state.points[this.state.points.length - 2], b = this.state.points[this.state.points.length - 1];
      addEntity({ type: 'line', x1: a.x, y1: a.y, x2: b.x, y2: b.y });
      pushHistory();
      setPrompt('Specify next point or [Enter to end]:');
    } else {
      setPrompt('Specify next point:');
    }
  },
  onKeyDown(ev) {
    if (ev.key === 'Enter' || ev.key === 'Escape') {
      this.state = { points: [] };
      setPrompt('Specify first point:');
    }
  },
  drawPreview(c) {
    if (this.state.points.length === 0) return;
    const last = this.state.points[this.state.points.length - 1];
    let to = state.cursor.snap || state.cursor.world;
    to = applyConstraints(last, to);
    const a = w2s(last), b = w2s(to);
    c.strokeStyle = themeColors().preview; c.setLineDash([4, 4]); c.lineWidth = 1;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    c.setLineDash([]);
    // length and angle
    const dist = G.dist(last, to);
    const ang = G.angle(last, to) * 180 / Math.PI;
    c.fillStyle = themeColors().label; c.font = '11px monospace';
    c.fillText(formatLength(dist) + ' @ ' + ang.toFixed(1) + '°', b.x + 12, b.y - 8);

};

/* ----- ARC 3-POINT ----- */
tools.arc = {
  prompt: 'Specify start point:',
  state: { points: [] },
  onActivate() { this.state = { points: [] }; },
  onMouseDown(world, screen, ev) {
    if (ev.button !== 0) return;
    const p = state.cursor.snap || world;
    this.state.points.push(p);
    if (this.state.points.length === 1) setPrompt('Specify second point on arc:');
    else if (this.state.points.length === 2) setPrompt('Specify end point:');
    else if (this.state.points.length === 3) {
      const arc = arcFrom3Points(this.state.points[0], this.state.points[1], this.state.points[2]);
      if (arc) { addEntity(arc); pushHistory(); }
      else logMsg('Could not construct arc (collinear points)', 'err');
      this.state = { points: [] };
      setPrompt('Specify start point:');
    }
  },
  onKeyDown(ev) { if (ev.key === 'Escape') { this.state = { points: [] }; setPrompt('Specify start point:'); } },
  drawPreview(c) {
    if (this.state.points.length === 0) return;
    const to = state.cursor.snap || state.cursor.world;
    let pts;
    if (this.state.points.length === 1) {
      const a = w2s(this.state.points[0]), b = w2s(to);
      c.strokeStyle = themeColors().preview; c.lineWidth = 1; c.setLineDash([4, 4]);
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      c.setLineDash([]); return;
    }
    pts = [this.state.points[0], this.state.points[1], to];
    if (this.state.points.length === 3) pts = this.state.points;
    const arc = arcFrom3Points(pts[0], pts[1], pts[2]);
    if (!arc) return;
    const sc = w2s({ x: arc.cx, y: arc.cy });
    c.strokeStyle = themeColors().preview; c.lineWidth = 1; c.setLineDash([4, 4]);
    c.beginPath(); c.arc(sc.x, sc.y, arc.r * state.viewport.scale, -arc.endAngle, -arc.startAngle, false); c.stroke();
    c.setLineDash([]);
  },
};

function arcFrom3Points(p1, p2, p3) {
  const ax = p2.x - p1.x, ay = p2.y - p1.y, bx = p3.x - p2.x, by = p3.y - p2.y;
  const cross = ax * by - ay * bx;
  if (Math.abs(cross) < 1e-10) return null;
  const a = (p1.x * p1.x + p1.y * p1.y);
  const b = (p2.x * p2.x + p2.y * p2.y);
  const c = (p3.x * p3.x + p3.y * p3.y);
  const D = 2 * (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y));
  const ux = (a * (p2.y - p3.y) + b * (p3.y - p1.y) + c * (p1.y - p2.y)) / D;
  const uy = (a * (p3.x - p2.x) + b * (p1.x - p3.x) + c * (p2.x - p1.x)) / D;
  const r = Math.hypot(p1.x - ux, p1.y - uy);
  let sa = Math.atan2(p1.y - uy, p1.x - ux);
  let ma = Math.atan2(p2.y - uy, p2.x - ux);
  let ea = Math.atan2(p3.y - uy, p3.x - ux);
  // normalize so we go CCW from sa through ma to ea
  const norm = (a) => { while (a < 0) a += Math.PI * 2; while (a >= Math.PI * 2) a -= Math.PI * 2; return a; };
  sa = norm(sa); ma = norm(ma); ea = norm(ea);
  // if mid not between sa and ea CCW, swap
  let s = sa, e = ea;
  let m = ma;
  if (m < s) m += Math.PI * 2;
  if (e < s) e += Math.PI * 2;
  if (m > e) { // not in range, go CW: swap
    [s, e] = [ea, sa];
    if (e < s) e += Math.PI * 2;
  }
  return { type: 'arc', cx: ux, cy: uy, r, startAngle: sa, endAngle: ea < sa ? ea + Math.PI * 2 : ea };
}
