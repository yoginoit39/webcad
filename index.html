function drawEntityGhost(e) {
  ctx.strokeStyle = '#3399ff';
  ctx.fillStyle = '#3399ff';
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  switch (e.type) {
    case 'line': { const a = w2s({ x: e.x1, y: e.y1 }), b = w2s({ x: e.x2, y: e.y2 }); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); break; }
    case 'polyline': { ctx.beginPath(); for (let i = 0; i < e.points.length; i++) { const p = w2s(e.points[i]); if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); } if (e.closed) ctx.closePath(); ctx.stroke(); break; }
    case 'circle': { const c = w2s({ x: e.cx, y: e.cy }); ctx.beginPath(); ctx.arc(c.x, c.y, e.r * state.viewport.scale, 0, Math.PI * 2); ctx.stroke(); break; }
    case 'arc': { const c = w2s({ x: e.cx, y: e.cy }); ctx.beginPath(); ctx.arc(c.x, c.y, e.r * state.viewport.scale, -e.endAngle, -e.startAngle, false); ctx.stroke(); break; }
    case 'ellipse': { const c = w2s({ x: e.cx, y: e.cy }); ctx.beginPath(); ctx.ellipse(c.x, c.y, e.rx * state.viewport.scale, e.ry * state.viewport.scale, 0, 0, Math.PI * 2); ctx.stroke(); break; }
    case 'wall': {
      const edges = computeWallEdges(e.points, e.thickness || 0.5);
      if (edges) {
        for (const side of [edges.left, edges.right]) {
          ctx.beginPath();
          for (let i = 0; i < side.length; i++) {
            const p = w2s(side[i]);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }
      }
      break;
    }
    case 'door': drawDoor(e, '#3399ff'); break;
    case 'window': drawWindow(e, '#3399ff'); break;
    case 'room': {
      ctx.beginPath();
      for (let i = 0; i < e.boundary.length; i++) {
        const sp = w2s(e.boundary[i]);
        if (i === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
      }
      ctx.closePath(); ctx.stroke();
      break;
    }
  }
  ctx.globalAlpha = 1;
}

function mirrorEntity(e, a, b) {
  Ent.transform(e, (p) => G.mirrorAbout(p, a, b));
  if (e.type === 'arc') {
    // mirror angles
    const ang = G.angle(a, b);
    const mAng = (orig) => 2 * ang - orig;
    const ns = mAng(e.endAngle), ne = mAng(e.startAngle);
    e.startAngle = ns; e.endAngle = ne;
  }
  // bent line: bulge flips because perpendicular flips through mirror
  if (e.type === 'line' && e.bulge) e.bulge = -e.bulge;
}

        drawEntityGhost(ghost);
      }
      c.globalAlpha = 1;
    }
  },
};

function scaleEntity(e, c, f) {
  Ent.transform(e, (p) => G.scaleAbout(p, c, f));
  if (e.type === 'circle' || e.type === 'arc') e.r *= f;
  if (e.type === 'ellipse') { e.rx *= f; e.ry *= f; }
  if (e.type === 'text') e.height *= f;
  if (e.type === 'wall') e.thickness *= f;
  if (e.type === 'door' || e.type === 'window') {
    e.width *= f;
    if (e.thickness) e.thickness *= f;
  }
  if (e.type === 'line' && e.bulge) e.bulge *= f;
}

function offsetEntity(e, side, d) {
  if (e.type === 'line') {
    const a = { x: e.x1, y: e.y1 }, b = { x: e.x2, y: e.y2 };
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    let nx = -dy / len, ny = dx / len;
    // pick side
    const cp = G.closestOnLine(side, a, b);
    const dir = { x: side.x - cp.x, y: side.y - cp.y };
    if (dir.x * nx + dir.y * ny < 0) { nx = -nx; ny = -ny; }
    return { type: 'line', x1: a.x + nx * d, y1: a.y + ny * d, x2: b.x + nx * d, y2: b.y + ny * d };
  }
  if (e.type === 'circle') {
    const ds = G.dist({ x: e.cx, y: e.cy }, side);
    const sign = ds > e.r ? 1 : -1;
    const nr = e.r + sign * d;
    if (nr <= 0) return null;
    return { type: 'circle', cx: e.cx, cy: e.cy, r: nr };
  }
  if (e.type === 'arc') {
    const ds = G.dist({ x: e.cx, y: e.cy }, side);
    const sign = ds > e.r ? 1 : -1;
    const nr = e.r + sign * d;
    if (nr <= 0) return null;
    return { type: 'arc', cx: e.cx, cy: e.cy, r: nr, startAngle: e.startAngle, endAngle: e.endAngle };
  }
  if (e.type === 'polyline') {
    // Simple: offset each segment perpendicularly and join at intersections
    const pts = e.points;
    const closed = e.closed;
    const N = pts.length;
    if (N < 2) return null;
    // determine sign by checking first segment
    const a = pts[0], b = pts[1];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    let nx = -dy / len, ny = dx / len;
    const cp = G.closestOnLine(side, a, b);
    const dir = { x: side.x - cp.x, y: side.y - cp.y };
    if (dir.x * nx + dir.y * ny < 0) { nx = -nx; ny = -ny; }
    // signed distance: positive in direction (nx,ny)
    // offset each segment
    const segs = [];
    for (let i = 0; i < N - 1; i++) {
      const p1 = pts[i], p2 = pts[i + 1];
      const sdx = p2.x - p1.x, sdy = p2.y - p1.y, sl = Math.hypot(sdx, sdy) || 1;
      // determine sign relative to original direction
      // for consistent winding, we use a perpendicular that follows the sign chosen for first segment
      // but each subsequent segment may have different orientation; we need to decide which side.
      // Use winding-consistent approach: rotate the perpendicular based on whether segment direction has changed.
      // Simpler: for each segment use perpendicular consistent with first segment's sign relative to that segment's direction.
      // We'll compute sn as left or right of (sdx,sdy). first segment: (nx,ny) = ?
      // For first segment dir (dx,dy), the perpendicular to its left is (-dy,dx) and right is (dy,-dx).
      // We chose (nx,ny). Compute scalar 'side' = sign of cross product between segment and (nx,ny).
      // Actually simpler: just use perpendicular such that signed offset is consistent — left perpendicular.
      // Decision: at first segment, we picked nx,ny. For other segments use the same handedness:
      // i.e., perpendicular to (sdx,sdy) on the same side.
      // Cross of first seg with first nx,ny tells us "left" vs "right".
      // For subsequent: use perpendicular(-sdy,sdx)/sl scaled by same sign.
      let sgn = 1;
      // recompute by cross:
      // first seg cross: dx * (-dy/len) ... that's just length squared / -len -> negative => "left perp"
      // Actually we just preserve sign: compute first seg cross between (sdx,sdy) and (nx,ny):
      // For first seg: cross1 = dx*ny - dy*nx  (positive => nx,ny is left of direction)
      // We want same sign for all
      const cross1 = dx * ny - dy * nx;
      const px = -sdy / sl, py = sdx / sl; // left perpendicular
      const crossi = sdx * py - sdy * px;
      const useLeft = (cross1 >= 0) === (crossi >= 0);
      const fnx = useLeft ? px : -px;
      const fny = useLeft ? py : -py;
      segs.push({
        a: { x: p1.x + fnx * d, y: p1.y + fny * d },
        b: { x: p2.x + fnx * d, y: p2.y + fny * d },
      });
    }
    if (closed) {
      const p1 = pts[N - 1], p2 = pts[0];
      const sdx = p2.x - p1.x, sdy = p2.y - p1.y, sl = Math.hypot(sdx, sdy) || 1;
      const cross1 = dx * ny - dy * nx;
      const px = -sdy / sl, py = sdx / sl;
      const crossi = sdx * py - sdy * px;
      const useLeft = (cross1 >= 0) === (crossi >= 0);
      const fnx = useLeft ? px : -px;
      const fny = useLeft ? py : -py;
      segs.push({
        a: { x: p1.x + fnx * d, y: p1.y + fny * d },
        b: { x: p2.x + fnx * d, y: p2.y + fny * d },
      });
    }
    // join consecutive segments at intersections
    const newPts = [];
    if (!closed) newPts.push({ ...segs[0].a });
    for (let i = 0; i < segs.length; i++) {
      const next = segs[(i + 1) % segs.length];
      if (i === segs.length - 1 && !closed) { newPts.push({ ...segs[i].b }); break; }
      const ip = G.lineLineIntersect(segs[i].a, segs[i].b, next.a, next.b);
      if (ip) newPts.push({ x: ip.x, y: ip.y });
      else newPts.push({ ...segs[i].b });
    }
    return { type: 'polyline', points: newPts, closed };
  }
  return null;
}

/* ----- TRIM ----- */
tools.trim = {
  prompt: 'Select object to trim (click on segment to remove):',
  onActivate() {},
  onMouseDown(world, screen, ev) {
    if (ev.button !== 0) return;
    const id = selectAt(world);
    if (!id) return;
    const target = state.entities.get(id);
    if (!target) return;
    // find intersections with all other entities
    let pts = [];
    for (const e of state.entities.values()) {
      if (e.id === target.id) continue;
      const layer = state.layers.get(e.layer);
      if (!layer || !layer.visible) continue;
      pts = pts.concat(entityIntersect(target, e));
    }
    if (target.type === 'line') {
      // sort intersections by t along line
      const a = { x: target.x1, y: target.y1 }, b = { x: target.x2, y: target.y2 };
      const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
      const ts = pts.map(p => ({ p, t: ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 })).filter(o => o.t > 1e-6 && o.t < 1 - 1e-6).sort((x, y) => x.t - y.t);
      const clickT = ((world.x - a.x) * dx + (world.y - a.y) * dy) / l2;
      // find segment containing click
      let lo = 0, hi = 1;
      for (const o of ts) { if (o.t < clickT) lo = o.t; else { hi = o.t; break; } }
      if (lo === 0 && hi === 1) { logMsg('No cutting edge found', 'err'); return; }
      // remove segment lo..hi -> keep two pieces 0..lo and hi..1
      const newSegs = [];
      if (lo > 1e-6) newSegs.push([0, lo]);
      if (hi < 1 - 1e-6) newSegs.push([hi, 1]);
      state.entities.delete(target.id);
      state.selection.delete(target.id);
      for (const [s, e] of newSegs) {
        addEntity({ type: 'line', x1: a.x + s * dx, y1: a.y + s * dy, x2: a.x + e * dx, y2: a.y + e * dy, layer: target.layer });
      }
      pushHistory();
    } else if (target.type === 'circle') {
      // sort by angle
      const angs = pts.map(p => ((Math.atan2(p.y - target.cy, p.x - target.cx) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)).sort((a, b) => a - b);
      const clickA = ((Math.atan2(world.y - target.cy, world.x - target.cx) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      if (angs.length < 2) { logMsg('Need at least 2 cutting edges to trim circle', 'err'); return; }
      // find segment
      let lo = angs[angs.length - 1] - 2 * Math.PI, hi = angs[0];
      for (let i = 0; i < angs.length; i++) {
        if (angs[i] > clickA) { hi = angs[i]; lo = i === 0 ? angs[angs.length - 1] - 2 * Math.PI : angs[i - 1]; break; }
      }
      // create arc from hi to lo (going around)
      let sa = hi, ea = lo + 2 * Math.PI;
      if (ea < sa) ea += 2 * Math.PI;
      state.entities.delete(target.id);
      state.selection.delete(target.id);
      addEntity({ type: 'arc', cx: target.cx, cy: target.cy, r: target.r, startAngle: sa, endAngle: ea, layer: target.layer });
      pushHistory();
    } else {
      logMsg('Trim only supports line and circle', 'err');
    }
  },
  onKeyDown(ev) { if (ev.key === 'Escape' || ev.key === 'Enter') setTool('select'); },
  drawPreview() {},
};

    const a = this.state.first, b = e;

    if (!result) { logMsg('Cannot fillet (parallel or no intersection)', 'err'); return; }
    state.entities.delete(a.id); state.entities.delete(b.id);

function filletLines(a, b, r) {
  const A1 = { x: a.x1, y: a.y1 }, A2 = { x: a.x2, y: a.y2 };
  const B1 = { x: b.x1, y: b.y1 }, B2 = { x: b.x2, y: b.y2 };
  const ip = G.lineLineIntersect(A1, A2, B1, B2);
  if (!ip) return null;
  // unit vectors from intersection toward farther endpoint of each line
  const farA = G.dist(ip, A1) > G.dist(ip, A2) ? A1 : A2;
  const farB = G.dist(ip, B1) > G.dist(ip, B2) ? B1 : B2;
  const va = { x: farA.x - ip.x, y: farA.y - ip.y };
  const vb = { x: farB.x - ip.x, y: farB.y - ip.y };
  const la = Math.hypot(va.x, va.y), lb = Math.hypot(vb.x, vb.y);
  if (la === 0 || lb === 0) return null;
  const ua = { x: va.x / la, y: va.y / la };
  const ub = { x: vb.x / lb, y: vb.y / lb };
  const ang = Math.acos(Math.max(-1, Math.min(1, ua.x * ub.x + ua.y * ub.y)));
  if (ang < 1e-6 || Math.abs(ang - Math.PI) < 1e-6) return null;
  const t = r / Math.tan(ang / 2);
  if (t > la || t > lb) return null;
  const ta = { x: ip.x + ua.x * t, y: ip.y + ua.y * t };
  const tb = { x: ip.x + ub.x * t, y: ip.y + ub.y * t };
  // arc center: bisector
  const bisector = { x: ua.x + ub.x, y: ua.y + ub.y };
  const bl = Math.hypot(bisector.x, bisector.y) || 1;
  const distToCenter = r / Math.sin(ang / 2);
  const center = { x: ip.x + (bisector.x / bl) * distToCenter, y: ip.y + (bisector.y / bl) * distToCenter };
  let sa = Math.atan2(ta.y - center.y, ta.x - center.x);
  let ea = Math.atan2(tb.y - center.y, tb.x - center.x);
  // ensure CCW
  if (ea < sa) ea += Math.PI * 2;
  if (ea - sa > Math.PI) [sa, ea] = [ea, sa + Math.PI * 2];
  return {
    line1: { type: 'line', x1: farA.x, y1: farA.y, x2: ta.x, y2: ta.y, layer: a.layer },
    line2: { type: 'line', x1: farB.x, y1: farB.y, x2: tb.x, y2: tb.y, layer: b.layer },
    arc: r > 0 ? { type: 'arc', cx: center.x, cy: center.y, r, startAngle: sa, endAngle: ea, layer: a.layer } : null,
  };
}

      this.state = { points: [], thickness: this.state.thickness };
      setPrompt('Specify wall start point:');

    if (this.state.points.length === 0) return;
    let to = state.cursor.snap || state.cursor.world;
    const last = this.state.points[this.state.points.length - 1];
    to = applyConstraints(last, to);
    const previewPts = [...this.state.points, to];
    const edges = computeWallEdges(previewPts, this.state.thickness);
    if (!edges) return;
    c.strokeStyle = themeColors().preview; c.lineWidth = 1; c.setLineDash([4, 4]);

};

let lastDoorWidth = 2.67;
tools.door = {
  prompt: 'Specify door hinge point:',
  state: { phase: 'hinge', hinge: null, swing: 1 },
  onActivate() {
    const v = prompt('Door width (' + state.units + '):', String(lastDoorWidth));
    const w = parseFloat(v);
    if (isNaN(w) || w <= 0) { setTool('select'); return; }
    lastDoorWidth = w;
    this.state = { phase: 'hinge', hinge: null, swing: 1, width: w };
    setPrompt('Click hinge point on a wall:');
    for (const l of state.layers.values()) if (l.name.toLowerCase() === 'doors') { state.activeLayerId = l.id; refreshLayersUI(); break; }
  },
  onMouseDown(world, screen, ev) {
    if (ev.button !== 0) return;
    const p = state.cursor.snap || world;
    if (this.state.phase === 'hinge') {
      this.state.hinge = p;
      // try to detect host wall angle from snap or nearest wall
      const wallAngle = guessWallAngleAt(p);
      this.state.wallAngle = wallAngle;
      this.state.phase = 'direction';
      setPrompt('Click direction the door swings open:');
    } else if (this.state.phase === 'direction') {
      // determine swing side based on click position relative to wall direction
      const dx = p.x - this.state.hinge.x, dy = p.y - this.state.hinge.y;
      const wa = this.state.wallAngle;
      const cross = Math.cos(wa) * dy - Math.sin(wa) * dx;
      // also check which side of hinge along wall (flip wallAngle if door extends opposite)
      const along = Math.cos(wa) * dx + Math.sin(wa) * dy;
      let finalAngle = wa;
      if (along < 0) finalAngle = wa + Math.PI;
      const swing = (cross > 0) ? 1 : -1;
      // re-evaluate cross based on finalAngle if flipped
      const recross = Math.cos(finalAngle) * dy - Math.sin(finalAngle) * dx;
      const finalSwing = recross > 0 ? 1 : -1;
      addEntity({ type: 'door', x: this.state.hinge.x, y: this.state.hinge.y, width: this.state.width, wallAngle: finalAngle, swing: finalSwing, openAngle: Math.PI / 2 });
      pushHistory();
      setTool('select');
    }
  },
  onKeyDown(ev) { if (ev.key === 'Escape') setTool('select'); },
  drawPreview(c) {
    if (this.state.phase === 'direction' && this.state.hinge) {
      const to = state.cursor.snap || state.cursor.world;
      const dx = to.x - this.state.hinge.x, dy = to.y - this.state.hinge.y;
      const wa = this.state.wallAngle;
      const along = Math.cos(wa) * dx + Math.sin(wa) * dy;
      const finalAngle = along < 0 ? wa + Math.PI : wa;
      const cross = Math.cos(finalAngle) * dy - Math.sin(finalAngle) * dx;
      const swing = cross > 0 ? 1 : -1;
      drawDoor({ x: this.state.hinge.x, y: this.state.hinge.y, width: this.state.width, wallAngle: finalAngle, swing, openAngle: Math.PI / 2 }, '#888');
    }
  },
};

function guessWallAngleAt(p) {
  // find nearest wall and use its segment direction
  const tolWorld = pxToWorld(40);
  let best = null, bd = Infinity;
  for (const e of state.entities.values()) {
    if (e.type !== 'wall') continue;
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible) continue;
    for (let i = 0; i < e.points.length - 1; i++) {
      const c = G.closestOnSegment(p, e.points[i], e.points[i + 1]);
      const d = G.dist(p, c);
      if (d < bd && d < tolWorld) {
        bd = d;
        best = { angle: G.angle(e.points[i], e.points[i + 1]) };
      }
    }
  }
  if (best) return best.angle;
  // also try lines as fallback
  for (const e of state.entities.values()) {
    if (e.type !== 'line') continue;
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible) continue;
    const c = G.closestOnSegment(p, { x: e.x1, y: e.y1 }, { x: e.x2, y: e.y2 });
    const d = G.dist(p, c);
    if (d < bd && d < tolWorld) {
      bd = d;
      best = { angle: G.angle({ x: e.x1, y: e.y1 }, { x: e.x2, y: e.y2 }) };
    }
  }
  return best ? best.angle : 0;
}

      addEntity({ type: 'window', x: this.state.p1.x, y: this.state.p1.y, width: this.state.width, wallAngle: ang, thickness: this.state.thickness });
      pushHistory();
      setTool('select');
    }
  },
  onKeyDown(ev) {
    if (ev.key === 'Enter' && this.state.phase === 'p2' && this.state.p1) {
      addEntity({ type: 'window', x: this.state.p1.x, y: this.state.p1.y, width: this.state.width, wallAngle: this.state.wallAngle, thickness: this.state.thickness });
      pushHistory();
      setTool('select');
    } else if (ev.key === 'Escape') setTool('select');
  },
  drawPreview(c) {
    if (this.state.phase === 'p2' && this.state.p1) {
      const to = state.cursor.snap || state.cursor.world;
      const ang = G.angle(this.state.p1, to);
      drawWindow({ x: this.state.p1.x, y: this.state.p1.y, width: this.state.width, wallAngle: ang, thickness: this.state.thickness }, '#888');
    }
  },
};

/* ----- ROOM ----- */
function polyArea(pts) {
  let a = 0;
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    a += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
  }
  return Math.abs(a) / 2;
}

function polyCentroid(pts) {
  let cx = 0, cy = 0, signedA = 0;
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const f = pts[i].x * pts[j].y - pts[j].x * pts[i].y;
    signedA += f;
    cx += (pts[i].x + pts[j].x) * f;
    cy += (pts[i].y + pts[j].y) * f;
  }
  signedA /= 2;
  if (Math.abs(signedA) < 1e-9) {
    let mx = 0, my = 0;
    for (const p of pts) { mx += p.x; my += p.y; }
    return { x: mx / n, y: my / n };
  }
  return { x: cx / (6 * signedA), y: cy / (6 * signedA) };
}

function formatArea(a) {
  if (state.units === 'ft') return Math.round(a) + ' sq ft';
  if (state.units === 'm') return a.toFixed(2) + ' m²';
  if (state.units === 'cm') return a.toFixed(0) + ' cm²';
  if (state.units === 'mm') return a.toFixed(0) + ' mm²';
  if (state.units === 'in') return a.toFixed(0) + ' in²';
  return a.toFixed(2) + ' ' + state.units + '²';
}

function drawRoom(e, color, highlight, hover) {
  if (!e.boundary || e.boundary.length < 3) return;
  // boundary path
  ctx.beginPath();
  for (let i = 0; i < e.boundary.length; i++) {
    const sp = w2s(e.boundary[i]);
    if (i === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
  }
  ctx.closePath();
  // floor fill
  const fill = adaptColor(e.floorColor || '#dceaff');
  ctx.fillStyle = highlight ? fill + 'aa' : (hover ? fill + '88' : fill + '55');
  ctx.fill();
  // outline — always visible so manually-drawn zones are seen even with light fill
  ctx.strokeStyle = color;
  ctx.lineWidth = highlight ? 2 : 1;
  if (highlight) ctx.setLineDash([6, 4]);
  ctx.stroke();
  if (highlight) ctx.setLineDash([]);
  // labels
  if (!e.labelPos) return;
  const lp = w2s(e.labelPos);
  const T = themeColors();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // soft pill background behind label
  ctx.font = '600 14px -apple-system, "Inter", sans-serif';
  const nameW = ctx.measureText(e.name || 'Room').width;
  ctx.font = '11px -apple-system, "Inter", sans-serif';
  const areaText = formatArea(e.area || 0);
  const areaW = ctx.measureText(areaText).width;
  const w = Math.max(nameW, areaW) + 16;
  const h = 36;
  ctx.fillStyle = T.dimBg + 'cc';
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(lp.x - w / 2, lp.y - h / 2, w, h, 6); ctx.fill(); }
  else { ctx.fillRect(lp.x - w / 2, lp.y - h / 2, w, h); }
  // name
  ctx.fillStyle = T.label;
  ctx.font = '600 14px -apple-system, "Inter", sans-serif';
  ctx.fillText(e.name || 'Room', lp.x, lp.y - 7);
  // area
  ctx.fillStyle = color;
  ctx.font = '11px -apple-system, "Inter", sans-serif';
  ctx.fillText(areaText, lp.x, lp.y + 8);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

function findRoomBoundary(p) {
  // Phase 1: closed entities (polyline, wall closed) — smallest containing
  let p1 = null, p1Area = Infinity;
  for (const e of state.entities.values()) {
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible) continue;
    let pts = null;
    if (e.type === 'polyline' && e.closed) pts = e.points;
    else if (e.type === 'wall' && e.closed) pts = e.points;
    if (pts && pts.length >= 3 && G.pointInPoly(p, pts)) {
      const a = polyArea(pts);
      if (a > 1e-6 && a < p1Area) { p1Area = a; p1 = pts.map(q => ({ x: q.x, y: q.y })); }
    }
  }
  // Phase 2: graph-based boundary trace (handles separate walls/lines)
  const p2 = traceRoomBoundary(p);
  const p2Area = p2 ? polyArea(p2) : Infinity;
  // pick the smaller (more specific) region
  if (p2 && p2Area > 1e-6 && p2Area < p1Area) return p2;
  return p1;
}

function traceRoomBoundary(clickPoint) {
  // Collect all line segments from visible walls/lines/polylines
  const segs = [];
  for (const e of state.entities.values()) {
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible) continue;
    if (e.type === 'line') segs.push([{ x: e.x1, y: e.y1 }, { x: e.x2, y: e.y2 }]);
    else if (e.type === 'polyline') {
      for (let i = 0; i < e.points.length - 1; i++) segs.push([{ ...e.points[i] }, { ...e.points[i + 1] }]);
      if (e.closed) segs.push([{ ...e.points[e.points.length - 1] }, { ...e.points[0] }]);
    } else if (e.type === 'wall') {
      for (let i = 0; i < e.points.length - 1; i++) segs.push([{ ...e.points[i] }, { ...e.points[i + 1] }]);
    }
  }
  if (segs.length < 3) return null;

  // Compute pairwise intersections, split segments
  const splits = segs.map(s => ({ a: s[0], b: s[1], pts: [s[0], s[1]] }));
  for (let i = 0; i < splits.length; i++) {
    for (let j = i + 1; j < splits.length; j++) {
      const ip = G.segSegIntersect(splits[i].a, splits[i].b, splits[j].a, splits[j].b);
      if (ip) {
        const np = { x: ip.x, y: ip.y };
        if (G.dist(np, splits[i].a) > 1e-6 && G.dist(np, splits[i].b) > 1e-6) splits[i].pts.push(np);
        if (G.dist(np, splits[j].a) > 1e-6 && G.dist(np, splits[j].b) > 1e-6) splits[j].pts.push(np);
      }
    }
  }

  // Build node list with tolerance-based dedup
  const nodes = [];
  const TOL = 1e-4;
  function nodeId(p) {
    for (let i = 0; i < nodes.length; i++) if (G.dist(nodes[i], p) < TOL) return i;
    nodes.push({ x: p.x, y: p.y });
    return nodes.length - 1;
  }
  const adj = {}; // node -> [{to, dx, dy}]
  function addEdge(n1, n2) {
    if (n1 === n2) return;
    if (!adj[n1]) adj[n1] = [];
    if (!adj[n2]) adj[n2] = [];
    // avoid duplicates
    if (adj[n1].some(e => e.to === n2)) return;
    adj[n1].push({ to: n2 });
    adj[n2].push({ to: n1 });
  }

  // Sort split points along each segment, dedup, create edges
  const allEdges = [];
  for (const s of splits) {
    const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
    s.pts.sort((u, v) => {
      const tu = (u.x - s.a.x) * dx + (u.y - s.a.y) * dy;
      const tv = (v.x - s.a.x) * dx + (v.y - s.a.y) * dy;
      return tu - tv;
    });
    const uniq = [s.pts[0]];
    for (let i = 1; i < s.pts.length; i++) {
      if (G.dist(uniq[uniq.length - 1], s.pts[i]) > TOL) uniq.push(s.pts[i]);
    }
    for (let i = 0; i < uniq.length - 1; i++) {
      const id1 = nodeId(uniq[i]);
      const id2 = nodeId(uniq[i + 1]);
      if (id1 !== id2) {
        addEdge(id1, id2);
        allEdges.push([id1, id2]);
      }
    }
  }
  if (allEdges.length === 0) return null;

  // Find closest edge to click and which side
  let closest = null, closestDist = Infinity, side = 0;
  for (const [a, b] of allEdges) {
    const A = nodes[a], B = nodes[b];
    const cp = G.closestOnSegment(clickPoint, A, B);
    const d = G.dist(clickPoint, cp);
    if (d < closestDist) {
      closestDist = d;
      closest = { a, b };
      const cross = (B.x - A.x) * (clickPoint.y - A.y) - (B.y - A.y) * (clickPoint.x - A.x);
      side = cross;
    }
  }
  if (!closest || side === 0) return null;

  // Walk so click is on left (cross > 0). Cross > 0 when going A->B means click is on left of A->B.
  let curFrom, curTo;
  if (side > 0) { curFrom = closest.a; curTo = closest.b; }
  else { curFrom = closest.b; curTo = closest.a; }

  const path = [];
  const seen = new Set();
  let safety = nodes.length * 4 + 50;

  while (safety-- > 0) {
    const key = curFrom + '>' + curTo;
    if (seen.has(key)) break; // returned to a previously-walked directed edge → cycle closed
    seen.add(key);
    path.push(curTo);

    // Pick next edge: leftmost rule = smallest CCW angle from reverse incoming
    const inAng = Math.atan2(nodes[curTo].y - nodes[curFrom].y, nodes[curTo].x - nodes[curFrom].x);
    const reverseIn = inAng + Math.PI;
    let nextNode = null, bestCCW = Infinity;
    const adjList = adj[curTo] || [];
    for (const conn of adjList) {
      if (conn.to === curFrom && adjList.length > 1) continue;
      const outAng = Math.atan2(nodes[conn.to].y - nodes[curTo].y, nodes[conn.to].x - nodes[curTo].x);
      let ccw = outAng - reverseIn;
      while (ccw < 0) ccw += 2 * Math.PI;
      while (ccw >= 2 * Math.PI) ccw -= 2 * Math.PI;
      if (ccw < bestCCW) { bestCCW = ccw; nextNode = conn.to; }
    }
    if (nextNode === null) return null;

    curFrom = curTo;
    curTo = nextNode;
  }

  if (path.length < 3) return null;
  const polyPts = path.map(i => ({ x: nodes[i].x, y: nodes[i].y }));
  if (!G.pointInPoly(clickPoint, polyPts)) return null;
  return polyPts;
}

let roomCount = 0;
tools.room = {
  prompt: 'Click inside a closed area to detect room:',
  onActivate() {
    setPrompt('Click inside a closed area to detect room:');
  },
  onMouseDown(world, screen, ev) {
    if (ev.button !== 0) return;
    const p = state.cursor.snap || world;
    const boundary = findRoomBoundary(p);
    if (!boundary || boundary.length < 3) {
      logMsg('No closed boundary found here. Make sure walls/lines fully enclose the area.', 'err');
      return;
    }
    // count existing rooms for default name
    let nRooms = 0;
    for (const ent of state.entities.values()) if (ent.type === 'room') nRooms++;
    const name = prompt('Room name:', 'Room ' + (nRooms + 1));
    if (name === null) return;
    const labelPos = polyCentroid(boundary);
    const area = polyArea(boundary);
    const roomsLayer = findLayerId('Rooms');
    addEntity({
      type: 'room',
      boundary,
      labelPos,
      name: name || 'Room',
      area,
      floorColor: pickRoomColor(name),
      layer: roomsLayer,
    });
    pushHistory();
    refreshProperties();
    logMsg('Created room: ' + (name || 'Room') + ' (' + formatArea(area) + ')', 'info');
  },
  onKeyDown(ev) { if (ev.key === 'Escape') setTool('select'); },
  drawPreview() {},
};

tools.zone = {
  prompt: 'Click first vertex of zone:',
  state: { points: [] },
  onActivate() {
    this.state = { points: [] };
    setPrompt('Click first vertex of zone:');
  },
  onMouseDown(world, screen, ev) {
    if (ev.button !== 0) return;
    let p = state.cursor.snap || world;
    if (this.state.points.length > 0) p = applyConstraints(this.state.points[this.state.points.length - 1], p);
    this.state.points.push(p);
    setPrompt('Click next vertex [Enter / C = close, Esc = cancel]:');
  },
  onKeyDown(ev) {
    if ((ev.key === 'Enter' || ev.key.toLowerCase() === 'c') && this.state.points.length >= 3) {
      const boundary = this.state.points.slice();
      let nZones = 0;
      for (const ent of state.entities.values()) if (ent.type === 'room' && (ent.name || '').toLowerCase().startsWith('zone')) nZones++;
      const name = prompt('Zone name:', 'Zone ' + (nZones + 1));
      if (name === null) { this.state = { points: [] }; setPrompt('Click first vertex of zone:'); return; }
      addEntity({
        type: 'room',
        boundary,
        labelPos: polyCentroid(boundary),
        name: name || 'Zone',
        area: polyArea(boundary),
        floorColor: '#f4f4f6',
        layer: findLayerId('Rooms'),
      });
      pushHistory();
      this.state = { points: [] };
      logMsg('Created zone: ' + (name || 'Zone') + ' (' + formatArea(polyArea(boundary)) + ')', 'info');
      setTool('select');
    } else if (ev.key === 'Escape') {
      this.state = { points: [] };
      setTool('select');
    }
  },
  drawPreview(c) {
    if (this.state.points.length === 0) return;
    let to = state.cursor.snap || state.cursor.world;
    const last = this.state.points[this.state.points.length - 1];
    to = applyConstraints(last, to);
    c.strokeStyle = themeColors().preview; c.lineWidth = 1; c.setLineDash([4, 4]);
    c.beginPath();
    for (let i = 0; i < this.state.points.length; i++) {
      const p = w2s(this.state.points[i]);
      if (i === 0) c.moveTo(p.x, p.y); else c.lineTo(p.x, p.y);
    }
    const sp = w2s(to);
    c.lineTo(sp.x, sp.y);
    if (this.state.points.length >= 2) {
      const start = w2s(this.state.points[0]);
      c.lineTo(start.x, start.y);
    }
    c.stroke();
    c.setLineDash([]);
    if (this.state.points.length >= 2) {
      const closePts = [...this.state.points, to];
      const a = polyArea(closePts);
      const cp = w2s(polyCentroid(closePts));
      c.fillStyle = themeColors().label;
      c.font = '11px -apple-system, sans-serif';
      c.textAlign = 'center';
      c.fillText(formatArea(a), cp.x, cp.y);
      c.textAlign = 'start';
    }
  },
};

function pickRoomColor(name) {
  const palette = {
    living: '#f0e8d8', bed: '#e1ecf6', bath: '#d8ecf0',
    kitchen: '#f6e8d8', dining: '#f0d8e1', office: '#e1f0d8',
    closet: '#ece8e0', hall: '#ececec', garage: '#dadcde',
  };
  const lc = (name || '').toLowerCase();
  for (const k of Object.keys(palette)) if (lc.includes(k)) return palette[k];
  return '#e7eef9';
}

/* ============================================================
   PAN / ZOOM
   ============================================================ */
let panState = { active: false, lastX: 0, lastY: 0 };
let spaceHeld = false;
function startPan(x, y) { panState = { active: true, lastX: x, lastY: y }; canvas.style.cursor = 'grabbing'; }
function endPan() { panState.active = false; canvas.style.cursor = spaceHeld ? 'grab' : 'crosshair'; }
function doPan(x, y) {
  const dx = (x - panState.lastX) / state.viewport.scale;
  const dy = (panState.lastY - y) / state.viewport.scale;
  state.viewport.x -= dx;
  state.viewport.y -= dy;
  panState.lastX = x; panState.lastY = y;
  render();
}

function zoomBy(factor, around) {
  const before = around ? s2w(around) : s2w({ x: CW() / 2, y: CH() / 2 });
  state.viewport.scale *= factor;
  state.viewport.scale = Math.max(0.001, Math.min(state.viewport.scale, 1e6));
  if (around) {
    const after = s2w(around);
    state.viewport.x += before.x - after.x;
    state.viewport.y += before.y - after.y;
  }
  document.getElementById('zoom-info').textContent = (state.viewport.scale).toFixed(0) + 'x';
  render();
}

function zoomExtents() {
  if (state.entities.size === 0) {
    state.viewport.x = 0; state.viewport.y = 0; state.viewport.scale = 20;
    render(); return;
  }
  let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
  for (const e of state.entities.values()) {
    const bb = Ent.bbox(e);
    mnx = Math.min(mnx, bb.min.x); mny = Math.min(mny, bb.min.y);
    mxx = Math.max(mxx, bb.max.x); mxy = Math.max(mxy, bb.max.y);
  }
  const w = mxx - mnx, h = mxy - mny;
  const margin = 1.1;
  const sx = CW() / (w * margin || 1);
  const sy = CH() / (h * margin || 1);
  state.viewport.scale = Math.min(sx, sy);
  state.viewport.x = (mnx + mxx) / 2;
  state.viewport.y = (mny + mxy) / 2;
  document.getElementById('zoom-info').textContent = (state.viewport.scale).toFixed(0) + 'x';
  render();
}

   COMMAND LINE
   ============================================================ */
const commandAliases = {
  'l': 'line', 'line': 'line',
  'pl': 'polyline', 'polyline': 'polyline',
  'rec': 'rectangle', 'rectangle': 'rectangle',
  'c': 'circle', 'circle': 'circle',
  'a': 'arc', 'arc': 'arc',
  'el': 'ellipse', 'ellipse': 'ellipse',
  't': 'text', 'text': 'text',
  'dli': 'dimension', 'dim': 'dimension', 'dimension': 'dimension',
  'h': 'hatch', 'hatch': 'hatch',
  'e': 'erase', 'erase': 'erase',
  'm': 'move', 'move': 'move',
  'co': 'copy', 'copy': 'copy',
  'ro': 'rotate', 'rotate': 'rotate',
  'mi': 'mirror', 'mirror': 'mirror',
  'sc': 'scale', 'scale': 'scale',
  'o': 'offset', 'offset': 'offset',
  'tr': 'trim', 'trim': 'trim',
  'f': 'fillet', 'fillet': 'fillet',
  's': 'select', 'select': 'select',
  'esc': 'select',
  'w': 'wall', 'wall': 'wall',
  'd': 'door', 'door': 'door',
  'win': 'window', 'window': 'window',
  'r': 'room', 'room': 'room',
  'z': 'zone', 'zone': 'zone',
};

function execCommand(cmd) {
  cmd = cmd.trim().toLowerCase();
  if (!cmd) return;
  logMsg('> ' + cmd);
  if (commandAliases[cmd]) { setTool(commandAliases[cmd]); return; }
  if (cmd === 'u' || cmd === 'undo') { undo(); return; }
  if (cmd === 'r' || cmd === 'redo') { redo(); return; }
  if (cmd === 'ze' || cmd === 'zoomextents') { zoomExtents(); return; }
  if (cmd === 'all') {
    for (const id of state.entities.keys()) state.selection.add(id);
    refreshProperties(); render(); return;
  }
  if (cmd === 'clear') {
    state.entities.clear(); state.selection.clear();
    pushHistory(); render(); return;
  }
  if (cmd.startsWith('layer ')) {
    const name = cmd.slice(6);
    for (const l of state.layers.values()) if (l.name.toLowerCase() === name) { state.activeLayerId = l.id; refreshLayersUI(); render(); return; }
    addLayer(name); refreshLayersUI();
    return;
  }
  logMsg('Unknown command: ' + cmd, 'err');
}

function logMsg(s, kind = '') {
  const d = document.getElementById('cmdhistory');
  const div = document.createElement('div');
  if (kind) div.className = kind;
  div.textContent = s;
  d.appendChild(div);
  d.scrollTop = d.scrollHeight;
  while (d.children.length > 100) d.removeChild(d.firstChild);
}

/* ============================================================
   UI
   ============================================================ */
function refreshLayersUI() {
  const list = document.getElementById('layers-list');
  list.innerHTML = '';
  for (const l of state.layers.values()) {
    const row = document.createElement('div');
    row.className = 'layer-row' + (l.id === state.activeLayerId ? ' active' : '');
    row.innerHTML = `
      <span class="vis" title="Toggle visibility">${l.visible ? '👁' : '–'}</span>
      <span class="lock" title="Toggle lock">${l.locked ? '🔒' : '🔓'}</span>
      <span class="swatch" style="background:${l.color}"></span>
      <span class="name">${l.name}</span>
      <span style="opacity:0.5;cursor:pointer" data-act="del" title="Delete">×</span>
    `;
    row.onclick = (ev) => {
      const t = ev.target;
      if (t.classList.contains('vis')) { l.visible = !l.visible; render(); refreshLayersUI(); }
      else if (t.classList.contains('lock')) { l.locked = !l.locked; refreshLayersUI(); }
      else if (t.classList.contains('swatch')) {
        const c = prompt('Layer color (hex):', l.color);
        if (c) { l.color = c; render(); refreshLayersUI(); }
      } else if (t.dataset.act === 'del') {
        if (confirm('Delete layer "' + l.name + '"? Entities will be moved.')) { deleteLayer(l.id); refreshLayersUI(); render(); }
      } else {
        state.activeLayerId = l.id; refreshLayersUI();
      }
    };
    row.ondblclick = (ev) => {
      if (ev.target.classList.contains('name')) {
        const newName = prompt('Layer name:', l.name);
        if (newName) { l.name = newName; refreshLayersUI(); }
      }
    };
    list.appendChild(row);
  }
}

function refreshProperties() {
  const div = document.getElementById('properties');
  div.innerHTML = '';
  if (state.selection.size === 0) {
    div.innerHTML = '<div style="color:#777;font-size:11px">No selection</div>';
    return;
  }
  if (state.selection.size > 1) {
    div.innerHTML = `<div style="font-size:11px">${state.selection.size} objects selected</div>`;
    return;
  }
  const id = [...state.selection][0];
  const e = state.entities.get(id);
  if (!e) return;
  const addRow = (label, value, onChange) => {
    const r = document.createElement('div');
    r.className = 'prop-row';
    r.innerHTML = `<label>${label}</label>`;
    const inp = document.createElement('input');
    inp.value = value;
    inp.onchange = () => onChange(inp.value);
    r.appendChild(inp);
    div.appendChild(r);
  };
  addRow('Type', e.type, () => {});
  // layer dropdown
  const r = document.createElement('div'); r.className = 'prop-row';
  r.innerHTML = `<label>Layer</label>`;
  const sel = document.createElement('select');
  for (const l of state.layers.values()) {
    const o = document.createElement('option'); o.value = l.id; o.textContent = l.name;
    if (e.layer === l.id) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => { e.layer = sel.value; pushHistory(); render(); };
  r.appendChild(sel); div.appendChild(r);

  if (e.type === 'line') {
    addRow('X1', e.x1.toFixed(4), v => { e.x1 = parseFloat(v); pushHistory(); render(); });
    addRow('Y1', e.y1.toFixed(4), v => { e.y1 = parseFloat(v); pushHistory(); render(); });
    addRow('X2', e.x2.toFixed(4), v => { e.x2 = parseFloat(v); pushHistory(); render(); });
    addRow('Y2', e.y2.toFixed(4), v => { e.y2 = parseFloat(v); pushHistory(); render(); });
    addRow('Length', G.dist({ x: e.x1, y: e.y1 }, { x: e.x2, y: e.y2 }).toFixed(4), () => {});
    addRow('Bulge', (e.bulge || 0).toFixed(4), v => { e.bulge = parseFloat(v) || 0; pushHistory(); render(); });
    if (e.bulge && Math.abs(e.bulge) > 1e-6) {
      const r = document.createElement('div'); r.className = 'prop-row';
      r.innerHTML = `<label></label>`;
      const btn = document.createElement('button');
      btn.textContent = 'Straighten';
      btn.style.cssText = 'flex:1; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;';
      btn.onclick = () => { e.bulge = 0; pushHistory(); render(); refreshProperties(); };
      r.appendChild(btn); div.appendChild(r);
    }
  } else if (e.type === 'circle') {
    addRow('CX', e.cx.toFixed(4), v => { e.cx = parseFloat(v); pushHistory(); render(); });
    addRow('CY', e.cy.toFixed(4), v => { e.cy = parseFloat(v); pushHistory(); render(); });
    addRow('Radius', e.r.toFixed(4), v => { e.r = parseFloat(v); pushHistory(); render(); });
    addRow('Diameter', (e.r * 2).toFixed(4), v => { e.r = parseFloat(v) / 2; pushHistory(); render(); });
    addRow('Area', (Math.PI * e.r * e.r).toFixed(4), () => {});
  } else if (e.type === 'arc') {
    addRow('CX', e.cx.toFixed(4), v => { e.cx = parseFloat(v); pushHistory(); render(); });
    addRow('CY', e.cy.toFixed(4), v => { e.cy = parseFloat(v); pushHistory(); render(); });
    addRow('Radius', e.r.toFixed(4), v => { e.r = parseFloat(v); pushHistory(); render(); });
    addRow('Start °', (e.startAngle * 180 / Math.PI).toFixed(2), v => { e.startAngle = parseFloat(v) * Math.PI / 180; pushHistory(); render(); });
    addRow('End °', (e.endAngle * 180 / Math.PI).toFixed(2), v => { e.endAngle = parseFloat(v) * Math.PI / 180; pushHistory(); render(); });
  } else if (e.type === 'polyline') {
    addRow('Points', e.points.length, () => {});
    addRow('Closed', e.closed ? 'yes' : 'no', v => { e.closed = (v === 'yes' || v === 'true' || v === '1'); pushHistory(); render(); });
  } else if (e.type === 'text') {
    addRow('X', e.x.toFixed(4), v => { e.x = parseFloat(v); pushHistory(); render(); });
    addRow('Y', e.y.toFixed(4), v => { e.y = parseFloat(v); pushHistory(); render(); });
    addRow('Text', e.text, v => { e.text = v; pushHistory(); render(); });
    addRow('Height', e.height.toFixed(4), v => { e.height = parseFloat(v); pushHistory(); render(); });
    addRow('Rotation', ((e.rotation || 0) * 180 / Math.PI).toFixed(2), v => { e.rotation = parseFloat(v) * Math.PI / 180; pushHistory(); render(); });
  } else if (e.type === 'wall') {
    addRow('Vertices', e.points.length, () => {});
    addRow('Thickness', e.thickness.toFixed(4), v => { e.thickness = parseFloat(v); pushHistory(); render(); });
    let total = 0;
    for (let i = 0; i < e.points.length - 1; i++) total += G.dist(e.points[i], e.points[i + 1]);
    addRow('Length', total.toFixed(4), () => {});
  } else if (e.type === 'door') {
    addRow('X', e.x.toFixed(4), v => { e.x = parseFloat(v); pushHistory(); render(); });
    addRow('Y', e.y.toFixed(4), v => { e.y = parseFloat(v); pushHistory(); render(); });
    addRow('Width', e.width.toFixed(4), v => { e.width = parseFloat(v); pushHistory(); render(); });
    addRow('Wall ang°', (e.wallAngle * 180 / Math.PI).toFixed(2), v => { e.wallAngle = parseFloat(v) * Math.PI / 180; pushHistory(); render(); });
    addRow('Swing', e.swing > 0 ? 'left' : 'right', v => { e.swing = (v.toLowerCase() === 'left') ? 1 : -1; pushHistory(); render(); });
    addRow('Open °', ((e.openAngle || Math.PI / 2) * 180 / Math.PI).toFixed(0), v => { e.openAngle = parseFloat(v) * Math.PI / 180; pushHistory(); render(); });
  } else if (e.type === 'window') {
    addRow('X', e.x.toFixed(4), v => { e.x = parseFloat(v); pushHistory(); render(); });
    addRow('Y', e.y.toFixed(4), v => { e.y = parseFloat(v); pushHistory(); render(); });
    addRow('Width', e.width.toFixed(4), v => { e.width = parseFloat(v); pushHistory(); render(); });
    addRow('Wall ang°', (e.wallAngle * 180 / Math.PI).toFixed(2), v => { e.wallAngle = parseFloat(v) * Math.PI / 180; pushHistory(); render(); });
    addRow('Thickness', (e.thickness || 0.5).toFixed(4), v => { e.thickness = parseFloat(v); pushHistory(); render(); });
  } else if (e.type === 'room') {
    addRow('Name', e.name || '', v => { e.name = v; pushHistory(); render(); });
    addRow('Area', formatArea(e.area || 0), () => {});
    addRow('Vertices', e.boundary.length, () => {});
    // floor color row
    const r2 = document.createElement('div'); r2.className = 'prop-row';
    r2.innerHTML = `<label>Floor</label>`;
    const sw = document.createElement('input');
    sw.type = 'color'; sw.value = e.floorColor || '#dceaff';
    sw.style.flex = '1'; sw.style.height = '24px'; sw.style.padding = '0';
    sw.oninput = () => { e.floorColor = sw.value; render(); };
    sw.onchange = () => { pushHistory(); };
    r2.appendChild(sw); div.appendChild(r2);
    // recompute button
    const r3 = document.createElement('div'); r3.className = 'prop-row';
    r3.innerHTML = `<label></label>`;
    const btn = document.createElement('button');
    btn.textContent = 'Recompute area';
    btn.style.cssText = 'flex:1; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;';
    btn.onclick = () => {
      e.area = polyArea(e.boundary);
      e.labelPos = polyCentroid(e.boundary);
      pushHistory(); render(); refreshProperties();
    };
    r3.appendChild(btn); div.appendChild(r3);
  }
}

function refreshSnapOptions() {
  const div = document.getElementById('snap-options');
  div.innerHTML = '';
  for (const k of Object.keys(state.snapTypes)) {
    const id = 'sn-' + k;
    const row = document.createElement('div');
    row.style.fontSize = '11px';
    row.innerHTML = `<label><input type="checkbox" id="${id}" ${state.snapTypes[k] ? 'checked' : ''}> ${k}</label>`;
    div.appendChild(row);
    setTimeout(() => {
      document.getElementById(id).onchange = (e) => { state.snapTypes[k] = e.target.checked; render(); };
    }, 0);
  }
}

function updateStatus() {
  document.getElementById('entity-count').textContent = state.entities.size + ' entities';
  document.getElementById('zoom-info').textContent = state.viewport.scale.toFixed(0) + 'x';
  document.getElementById('t-grid').classList.toggle('on', state.grid.enabled);
  document.getElementById('t-ortho').classList.toggle('on', state.ortho);
  document.getElementById('t-snap').classList.toggle('on', state.snapEnabled);
  document.getElementById('t-polar').classList.toggle('on', state.polar);
  let nRooms = 0, totalArea = 0;
  for (const e of state.entities.values()) if (e.type === 'room') { nRooms++; totalArea += (e.area || 0); }
  document.getElementById('rooms-info').textContent = nRooms > 0 ? (nRooms + ' rooms · ' + formatArea(totalArea)) : '';
}

/* ============================================================
   FILE IO
   ============================================================ */
function saveJSON() {
  const data = {
    version: 1,
    entities: [...state.entities.values()],
    layers: [...state.layers.values()],
    activeLayerId: state.activeLayerId,
    units: state.units,
    grid: state.grid,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'drawing.json';
  a.click();
  state.isDirty = false;
  logMsg('Saved drawing.json', 'info');
}

function openJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      state.entities.clear();
      state.layers.clear();
      for (const l of data.layers) state.layers.set(l.id, l);
      for (const e of data.entities) state.entities.set(e.id, e);
      state.activeLayerId = data.activeLayerId;
      if (data.grid) state.grid = data.grid;
      if (data.units) state.units = data.units;
      // bump nextId past existing ids
      for (const id of state.entities.keys()) {
        const n = parseInt(id.replace(/[^0-9]/g, ''));
        if (!isNaN(n) && n >= nextId) nextId = n + 1;
      }
      pushHistory();
      refreshLayersUI();
      refreshProperties();
      zoomExtents();
      logMsg('Loaded ' + data.entities.length + ' entities', 'info');
    } catch (err) {
      logMsg('Error loading file: ' + err.message, 'err');
    }
  };
  reader.readAsText(file);
}

function exportSVG() {
  let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
  if (state.entities.size === 0) { logMsg('Nothing to export', 'err'); return; }
  for (const e of state.entities.values()) {
    const bb = Ent.bbox(e);
    mnx = Math.min(mnx, bb.min.x); mny = Math.min(mny, bb.min.y);
    mxx = Math.max(mxx, bb.max.x); mxy = Math.max(mxy, bb.max.y);
  }
  const m = 1;
  const W = mxx - mnx + 2 * m, H = mxy - mny + 2 * m;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${mnx - m} ${-(mxy + m)} ${W} ${H}" width="${W * 50}" height="${H * 50}">`;
  for (const e of state.entities.values()) {
    const layer = state.layers.get(e.layer);
    if (!layer || !layer.visible) continue;
    const c = layer.color;
    if (e.type === 'line') svg += `<line x1="${e.x1}" y1="${-e.y1}" x2="${e.x2}" y2="${-e.y2}" stroke="${c}" stroke-width="0.05" fill="none"/>`;
    else if (e.type === 'circle') svg += `<circle cx="${e.cx}" cy="${-e.cy}" r="${e.r}" stroke="${c}" stroke-width="0.05" fill="none"/>`;
    else if (e.type === 'polyline') {
      const pts = e.points.map(p => `${p.x},${-p.y}`).join(' ');
      svg += `<${e.closed ? 'polygon' : 'polyline'} points="${pts}" stroke="${c}" stroke-width="0.05" fill="none"/>`;
    } else if (e.type === 'arc') {
      const x1 = e.cx + e.r * Math.cos(e.startAngle), y1 = -(e.cy + e.r * Math.sin(e.startAngle));
      const x2 = e.cx + e.r * Math.cos(e.endAngle), y2 = -(e.cy + e.r * Math.sin(e.endAngle));
      const sweep = (e.endAngle - e.startAngle) > Math.PI ? 1 : 0;
      svg += `<path d="M ${x1} ${y1} A ${e.r} ${e.r} 0 ${sweep} 0 ${x2} ${y2}" stroke="${c}" stroke-width="0.05" fill="none"/>`;
    } else if (e.type === 'text') {
      svg += `<text x="${e.x}" y="${-e.y}" font-size="${e.height}" fill="${c}">${e.text}</text>`;
    } else if (e.type === 'ellipse') {
      svg += `<ellipse cx="${e.cx}" cy="${-e.cy}" rx="${e.rx}" ry="${e.ry}" stroke="${c}" stroke-width="0.05" fill="none"/>`;
    }
  }
  svg += '</svg>';
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'drawing.svg';
  a.click();
  logMsg('Exported drawing.svg', 'info');
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = 'drawing.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  logMsg('Exported drawing.png', 'info');
}

/* ============================================================
   EVENT HANDLING
   ============================================================ */
function setupEvents() {
  canvas.addEventListener('mousemove', (ev) => {
    const r = canvas.getBoundingClientRect();
    const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
    state.cursor.screen = { x: sx, y: sy };
    state.cursor.world = s2w({ x: sx, y: sy });
    computeTracking(state.cursor.world);
    state.cursor.snap = findSnap(state.cursor.world);
    // hover detection (only when select tool, not panning, no snap target)
    if (!panState.active && activeToolName === 'select' && !selectBox.active) {
      state.cursor.hoverId = selectAt(state.cursor.world);
    } else {
      state.cursor.hoverId = null;
    }
    document.getElementById('coords').textContent =
      state.cursor.world.x.toFixed(4) + ', ' + state.cursor.world.y.toFixed(4);
    if (panState.active) doPan(sx, sy);
    else if (state.activeTool && state.activeTool.onMouseMove) state.activeTool.onMouseMove(state.cursor.world, state.cursor.screen, ev);
    render();
  });

  canvas.addEventListener('mousedown', (ev) => {
    canvas.focus();
    const r = canvas.getBoundingClientRect();
    const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
    if (ev.button === 1 || ev.button === 2 || (ev.button === 0 && spaceHeld)) {
      startPan(sx, sy);
      ev.preventDefault();
      return;
    }
    if (state.activeTool && state.activeTool.onMouseDown) state.activeTool.onMouseDown(state.cursor.world, state.cursor.screen, ev);
    render();
  });

  canvas.addEventListener('mouseup', (ev) => {
    if (panState.active) { endPan(); return; }
    if (state.activeTool && state.activeTool.onMouseUp) state.activeTool.onMouseUp(state.cursor.world, state.cursor.screen, ev);
    render();
  });

  canvas.addEventListener('contextmenu', (ev) => ev.preventDefault());

  canvas.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const r = canvas.getBoundingClientRect();
    const around = { x: ev.clientX - r.left, y: ev.clientY - r.top };
    const factor = ev.deltaY > 0 ? 1 / 1.15 : 1.15;
    zoomBy(factor, around);
  }, { passive: false });

  document.addEventListener('keydown', (ev) => {
    if (document.activeElement === document.getElementById('cmd-input')) return;

    // space-pan
    if (ev.code === 'Space' && !ev.repeat && !spaceHeld) {
      spaceHeld = true;
      canvas.style.cursor = panState.active ? 'grabbing' : 'grab';
      ev.preventDefault();
      return;
    }

    // function keys / toggles
    if (ev.key === 'F3') { ev.preventDefault(); state.snapEnabled = !state.snapEnabled; updateStatus(); render(); return; }
    if (ev.key === 'F7') { ev.preventDefault(); state.grid.enabled = !state.grid.enabled; updateStatus(); render(); return; }
    if (ev.key === 'F8') { ev.preventDefault(); state.ortho = !state.ortho; if (state.ortho) state.polar = false; updateStatus(); render(); return; }
    if (ev.key === 'F10') { ev.preventDefault(); state.polar = !state.polar; if (state.polar) state.ortho = false; updateStatus(); render(); return; }

    if (ev.ctrlKey || ev.metaKey) {
      if (ev.key === 'z') { ev.preventDefault(); undo(); return; }
      if (ev.key === 'y' || (ev.key === 'z' && ev.shiftKey)) { ev.preventDefault(); redo(); return; }
      if (ev.key === 's') { ev.preventDefault(); saveJSON(); return; }
      if (ev.key === 'o') { ev.preventDefault(); document.getElementById('file-input').click(); return; }
      if (ev.key === 'a') {
        ev.preventDefault();
        for (const id of state.entities.keys()) state.selection.add(id);
        refreshProperties(); render(); return;
      }
      if (ev.key === 'c') { ev.preventDefault(); copySelection(); return; }
      if (ev.key === 'v') { ev.preventDefault(); pasteClipboard(); return; }
    }

    if (ev.key === 'Escape') {
      if (state.activeTool && state.activeTool.onKeyDown) state.activeTool.onKeyDown(ev);
      else { state.selection.clear(); refreshProperties(); render(); }
      return;
    }
    if (state.activeTool && state.activeTool.onKeyDown) state.activeTool.onKeyDown(ev);
    if (ev.key === 'Delete' || ev.key === 'Backspace') {
      if (state.selection.size > 0) {
        deleteEntities([...state.selection]);
        pushHistory();
        render();
      }
    }
  });

  document.addEventListener('keyup', (ev) => {
    if (ev.code === 'Space' && spaceHeld) {
      spaceHeld = false;
      if (!panState.active) canvas.style.cursor = 'crosshair';
    }
  });
}

function copySelection() {
  state.clipboard = [];
  for (const id of state.selection) {
    const e = state.entities.get(id);
    if (e) state.clipboard.push(JSON.parse(JSON.stringify(e)));
  }
  logMsg('Copied ' + state.clipboard.length + ' object(s)', 'info');
}
function pasteClipboard() {
  if (state.clipboard.length === 0) return;
  state.selection.clear();
  for (const e of state.clipboard) {
    const cp = JSON.parse(JSON.stringify(e));
    cp.id = newId();
    Ent.transform(cp, (p) => ({ x: p.x + 1, y: p.y + 1 }));
    state.entities.set(cp.id, cp);
    state.selection.add(cp.id);
  }
  pushHistory();
  refreshProperties();
  render();
}

const componentDescriptions = {
  bed: 'Queen-size bed in plan view (5\' × 6\'8"). Pillow detail at the head.',
  sofa: 'Three-seat sofa with backrest and cushion divisions (7\' × 3\').',
  table_round: 'Round table, 4\' diameter — typical small dining or conference.',
  table_rect: 'Rectangular table, 4\' × 2\'8" — typical dining or workdesk.',
  chair: 'Single chair with back indication (1\'6" square).',
  toilet: 'Standard toilet — tank rectangle plus oval bowl.',
  sink: 'Vanity sink, 2\' × 1\'8" with drain marker.',
  bathtub: 'Standard bathtub, 5\' × 2\'8".',
  stairs: 'Stairs with treads, 4\' wide × 9\' run. Edit count after placing.',
  tree: 'Tree symbol in plan, ~5\' canopy. Place in landscape areas.',
  car: 'Parking-stall car, 16\' × 6\'.',
};

function refreshComponentsUI() {
  const list = document.getElementById('components-list');
  list.innerHTML = '<div class="components-grid"></div>';
  const grid = list.querySelector('.components-grid');
  for (const c of components) {
    const el = document.createElement('div');
    el.className = 'comp';
    el.innerHTML = `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" stroke="currentColor">${c.svg}</svg><div class="label">${c.label}</div>`;
    el.dataset.ttName = c.label;
    el.dataset.ttDesc = (componentDescriptions[c.name] || 'Architectural symbol.') + ' Click, then click on canvas to place; click again to set rotation.';
    el.onclick = () => setTool('insertComponent', { component: c });
    grid.appendChild(el);
    bindTooltip(el);
  }
}

tools.insertComponent = {
  prompt: 'Specify insertion point:',
  state: { phase: 'pos', pos: null },
  onActivate(opts) {
    this.state = { phase: 'pos', pos: null, component: opts && opts.component };
    setPrompt('Click insertion point for ' + (this.state.component ? this.state.component.label : 'component') + ':');
  },
  onMouseDown(world, screen, ev) {
    if (ev.button !== 0) return;
    const p = state.cursor.snap || world;
    if (this.state.phase === 'pos') {
      this.state.pos = p;
      this.state.phase = 'rot';
      setPrompt('Specify rotation (or click to use 0°):');
    } else if (this.state.phase === 'rot') {
      const ang = G.angle(this.state.pos, p);
      placeComponent(this.state.component, this.state.pos, ang);
      pushHistory();
      setTool('select');
    }
  },
  onKeyDown(ev) {
    if (ev.key === 'Enter' && this.state.phase === 'rot' && this.state.pos) {
      placeComponent(this.state.component, this.state.pos, 0);
      pushHistory();
      setTool('select');
    } else if (ev.key === 'Escape') setTool('select');
  },
  drawPreview(c) {
    if (!this.state.component) return;
    const T = themeColors();
    if (this.state.phase === 'pos') {
      const at = state.cursor.snap || state.cursor.world;
      drawComponentGhost(this.state.component, at, 0, T.preview);
    } else if (this.state.phase === 'rot' && this.state.pos) {
      const to = state.cursor.snap || state.cursor.world;
      const ang = G.angle(this.state.pos, to);
      drawComponentGhost(this.state.component, this.state.pos, ang, T.preview);
    }
  },
};

function placeComponent(comp, at, ang) {
  if (!comp) return;
  const ents = comp.entities();
  const targetLayer = (() => {
    if (comp.name === 'tree') return findLayerId('Furniture');
    if (['bed', 'sofa', 'table_round', 'table_rect', 'chair', 'stairs', 'car'].includes(comp.name)) return findLayerId('Furniture');
    if (['toilet', 'sink', 'bathtub'].includes(comp.name)) return findLayerId('Furniture');
    return state.activeLayerId;
  })();
  for (const e of ents) {
    const cp = JSON.parse(JSON.stringify(e));
    Ent.transform(cp, (p) => {
      const r = G.rot(p, { x: 0, y: 0 }, ang);
      return { x: r.x + at.x, y: r.y + at.y };
    });
    if (cp.type === 'ellipse') cp.rotation = (cp.rotation || 0) + ang;
    cp.layer = targetLayer;
    addEntity(cp);
  }
}

function findLayerId(name) {
  for (const l of state.layers.values()) if (l.name.toLowerCase() === name.toLowerCase()) return l.id;
  return state.activeLayerId;
}

function drawComponentGhost(comp, at, ang, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.globalAlpha = 0.7;
  for (const e of comp.entities()) {
    const cp = JSON.parse(JSON.stringify(e));
    Ent.transform(cp, (p) => {
      const r = G.rot(p, { x: 0, y: 0 }, ang);
      return { x: r.x + at.x, y: r.y + at.y };
    });
    drawEntityGhost(cp);
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============================================================
   TOOLTIPS
   ============================================================ */
let tooltipEl = null;
let tooltipTimer = null;
let tooltipCurrent = null;
const TOOLTIP_DELAY = 350;

function showTooltip(el) {
  if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
  const name = el.dataset.ttName;
  if (!name) return;
  const desc = el.dataset.ttDesc || '';
  const key = el.dataset.ttKey || '';
  tooltipEl.innerHTML =
    `<div class="tt-head"><span class="tt-name">${escapeHtml(name)}</span>${key ? `<span class="tt-key">${escapeHtml(key)}</span>` : ''}</div>` +
    (desc ? `<div class="tt-desc">${escapeHtml(desc)}</div>` : '');
  tooltipEl.className = '';
  tooltipEl.classList.add('arrow-left');
  tooltipEl.style.left = '-9999px'; tooltipEl.style.top = '-9999px';
  tooltipEl.classList.add('show');
  // measure then position
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect();
    const ttr = tooltipEl.getBoundingClientRect();
    let placement = 'left'; // tooltip arrow points left → tooltip is right of element
    let x = r.right + 10;
    let y = r.top + r.height / 2 - ttr.height / 2;
    // if no room on right, flip
    if (x + ttr.width > window.innerWidth - 8) {
      placement = 'right'; // tooltip is left of element... but we don't have arrow-right, so use bottom
      x = r.left - ttr.width - 10;
    }
    // keep on screen vertically
    if (y < 8) y = 8;
    if (y + ttr.height > window.innerHeight - 8) y = window.innerHeight - ttr.height - 8;
    // for status bar (arrow-bottom or arrow-top) — detect by element being near bottom
    if (r.top > window.innerHeight - 60) {
      placement = 'bottom';
      tooltipEl.className = 'show arrow-bottom';
      x = r.left;
      y = r.top - ttr.height - 10;
      if (x + ttr.width > window.innerWidth - 8) x = window.innerWidth - ttr.width - 8;
      if (x < 8) x = 8;
    } else if (r.top < 60) {
      placement = 'top';
      tooltipEl.className = 'show arrow-top';
      x = r.left;
      y = r.bottom + 10;
      if (x + ttr.width > window.innerWidth - 8) x = window.innerWidth - ttr.width - 8;
      if (x < 8) x = 8;
    }
    tooltipEl.style.left = x + 'px';
    tooltipEl.style.top = y + 'px';
  });
}

function hideTooltip() {
  if (tooltipTimer) { clearTimeout(tooltipTimer); tooltipTimer = null; }
  if (tooltipEl) tooltipEl.classList.remove('show');
  tooltipCurrent = null;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function bindTooltip(el) {
  // suppress browser native tooltip
  if (el.title) { el.dataset.origTitle = el.title; el.removeAttribute('title'); }
  el.addEventListener('mouseenter', () => {
    if (tooltipTimer) clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(() => {
      tooltipCurrent = el;
      showTooltip(el);
    }, TOOLTIP_DELAY);
  });
  el.addEventListener('mouseleave', () => {
    if (tooltipTimer) { clearTimeout(tooltipTimer); tooltipTimer = null; }
    if (tooltipCurrent === el) hideTooltip();
  });
  el.addEventListener('mousedown', () => hideTooltip());
}

function bindAllTooltips(root) {
  (root || document).querySelectorAll('[data-tt-name]').forEach(bindTooltip);
}

/* ============================================================
   THEME
   ============================================================ */
function setTheme(theme) {
  if (theme === 'dark') document.body.classList.add('theme-dark');
  else document.body.classList.remove('theme-dark');
  try { localStorage.setItem('webcad-theme', theme); } catch (e) {}
  render();
}
function toggleTheme() {
  setTheme(document.body.classList.contains('theme-dark') ? 'light' : 'dark');
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');

  // default layers (colors tuned for light theme)
  addLayer('0', '#1a1a1f');
  addLayer('Walls', '#1a1a1f');
  addLayer('Doors', '#b94a3a');
  addLayer('Windows', '#2266c4');
  addLayer('Rooms', '#5a6cb8');
  addLayer('Furniture', '#6a6a72');
  addLayer('Dimensions', '#888892');
  addLayer('Text', '#1a1a1f');
  state.activeLayerId = [...state.layers.values()].find(l => l.name === 'Walls').id;

  // restore theme
  try {
    const saved = localStorage.getItem('webcad-theme');
    if (saved === 'dark') document.body.classList.add('theme-dark');
  } catch (e) {}

  refreshLayersUI();
  refreshSnapOptions();
  refreshProperties();
  refreshComponentsUI();
  buildHelp();
  bindAllTooltips();

  resize();
  window.addEventListener('resize', resize);
  setupEvents();

  // toolbar
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b => {
    b.onclick = () => setTool(b.dataset.tool);
  });

  // topbar
  document.getElementById('btn-new').onclick = () => {
    if (state.isDirty && !confirm('Discard current drawing?')) return;
    state.entities.clear(); state.selection.clear();
    state.history = []; state.historyIndex = -1;
    pushHistory();
    render();
  };
  document.getElementById('btn-save').onclick = saveJSON;
  document.getElementById('btn-open').onclick = () => document.getElementById('file-input').click();
  document.getElementById('file-input').onchange = (ev) => { if (ev.target.files[0]) openJSON(ev.target.files[0]); };
  document.getElementById('btn-export-svg').onclick = exportSVG;
  document.getElementById('btn-export-png').onclick = exportPNG;
  document.getElementById('btn-undo').onclick = undo;
  document.getElementById('btn-redo').onclick = redo;
  document.getElementById('btn-zoom-extents').onclick = zoomExtents;
  document.getElementById('btn-zoom-in').onclick = () => zoomBy(1.2);
  document.getElementById('btn-zoom-out').onclick = () => zoomBy(1 / 1.2);
  document.getElementById('btn-help').onclick = () => {
    const o = document.getElementById('help-overlay');
    o.style.display = o.style.display === 'block' ? 'none' : 'block';
  };
  document.getElementById('btn-theme').onclick = toggleTheme;
  document.getElementById('units-select').onchange = (ev) => { state.units = ev.target.value; render(); };
  document.getElementById('layer-add').onclick = () => {
    const name = prompt('Layer name:', 'Layer ' + state.layers.size);
    if (name) {
      const colors = ['#ffaa00', '#ff5577', '#55ccff', '#aaffaa', '#ffff99', '#ff77dd', '#77ddff'];
      addLayer(name, colors[state.layers.size % colors.length]);
      refreshLayersUI();
    }
  };

  // status bar toggles
  document.getElementById('t-grid').onclick = () => { state.grid.enabled = !state.grid.enabled; updateStatus(); render(); };
  document.getElementById('t-ortho').onclick = () => { state.ortho = !state.ortho; if (state.ortho) state.polar = false; updateStatus(); render(); };
  document.getElementById('t-snap').onclick = () => { state.snapEnabled = !state.snapEnabled; updateStatus(); render(); };
  document.getElementById('t-polar').onclick = () => { state.polar = !state.polar; if (state.polar) state.ortho = false; updateStatus(); render(); };

  // command line
  const cmdInput = document.getElementById('cmd-input');
  cmdInput.onkeydown = (ev) => {
    if (ev.key === 'Enter') {
      const v = cmdInput.value;
      cmdInput.value = '';
      execCommand(v);
    }
    if (ev.key === 'Escape') {
      cmdInput.value = '';
      cmdInput.blur();
      canvas.focus();
    }
  };

  // collapsible panel sections
  document.querySelectorAll('.panel-header').forEach(h => {
    h.addEventListener('click', (ev) => {
      // ignore clicks on buttons inside the header
      if (ev.target.closest('button')) return;
      h.parentElement.classList.toggle('collapsed');
    });
  });

  setTool('select');
  pushHistory();
  updateStatus();
  canvas.focus();
  logMsg('Welcome to WebCAD. Press ? for shortcuts. Type a command (L, C, REC, ...) or pick a tool.', 'info');
}

window.addEventListener('DOMContentLoaded', init);
